# cargo-audit configuration (RustSec). Read by `cargo audit` in the CI audit gate.
#
# The `ignore` list holds advisories we have assessed and accepted-with-tracking
# because the only fix is a major upstream bump that is out of scope for a
# dependency-audit change. Each entry names the blocker and its tracking issue.
# Everything NOT listed here still fails the gate — including any NEW advisory.
#
# Directly-fixable vulnerabilities are resolved in Cargo.lock, not ignored:
#   - crossbeam-epoch  RUSTSEC-2026-0204  -> 0.9.20
#   - quinn-proto      RUSTSEC-2026-0185  -> 0.11.16
#   - rustls-webpki    RUSTSEC-2026-0104/0098/0099/0049 -> dropped by scoping libsql
#     to its `core` feature (default-features = false). libsql only pulls in
#     hyper-rustls (and therefore rustls 0.22 / rustls-webpki 0.102.8) via its
#     `tls`/`remote`/`sync`/`replication` features; we only ever use the local
#     embedded engine (`Builder::new_local`), so those features were dead weight.
#   - quick-xml        RUSTSEC-2026-0194/0195 -> 0.41.0, via `cargo update -p plist`
#     (plist ^1 already allows 1.10.0, which requires quick-xml ^0.41.0; tauri
#     2.11.2's `^1` requirement on plist didn't need a version bump at all).

[advisories]
ignore = []
