name = "dev-unseen-schema"
reps = 3

notes = """
PRODUCTION-SHAPED. Dev-workflow domain. THE GENERALISATION TEST.

Every other case in this corpus uses `ticket` or `adr` — the same types the
worked examples show. That measures whether the model can follow a pattern it
has just been given. It does NOT measure whether the model can act on a type
it has never seen, which is the real workload: users invent their own schemas,
and none of them will resemble this corpus's examples.

So this case uses `release` with a lifecycle enum {cut,soak,shipped,rolled_back}
— vocabulary that appears in no worked example, no tool description, and no
candidate instruction anywhere in the prompt. The worked example in
create_node still says `ticket`/`status`/`in_dev`, deliberately: the model
must map from an example about one type onto a request about a different one.

`soak` is the load-bearing word. It is not a status the model can guess from
general knowledge the way `shipped` or `done` might be, and the user's phrasing
("it's baking on staging") does not contain it. The only way to produce `soak`
is to read the allowed values off the entity-types block and match the user's
description to one — which is inference over supplied context rather than
recall.

A corpus that only works on schemas resembling its own examples has taught
pattern-matching. This case is the guard against that, one domain over from the
invoice-examples trap.

SECOND UNSEEN ELEMENT

`build` is a field with no counterpart in any example, holding a value format
(2026.8.3) nothing in the prompt demonstrates. It measures the same question
on the field axis rather than the enum axis.

CONTAMINATION GUARD (#1932)

Deliberately distinct even from the rest of THIS corpus, which is the point of
the case.

PROVISIONAL ON #2123 — THIS CASE IS NOT PRODUCTION-SHAPED TODAY

Uses `field_values`, not `properties`, because a parameter named `properties`
is silently deleted by the Gemma-4 template. See dev-status-change-enum.toml's
notes for the measurement.

Production says `properties`; this case says `field_values`. So it does not
reproduce production's tool surface and must not be read as validated
production shape. Provisional on #2123 being fixed BY RENAMING, in which case
it becomes correct as written. Fixed any other way, it needs rewriting and
re-measuring rather than re-annotating.

MEASURED — per-case results recorded on #2122.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the release. Unseen type, unseen enum.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-release"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- release "Release" -> version: text, required; stage: enum {cut,soak,shipped,rolled_back}, required; build: text; owner: text [title_template: {version}]
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Search
Purpose: Find, list, or filter existing records by title, type, or stored \
field value.

CALL search_nodes NOW: your next action is the tool call, not planning text.

LISTING BY TYPE: to list every record of a type, use an empty query with \
node_type set.
"""
user = "What releases do we have open?"
expect = """
search_nodes(node_type="release") — the unseen type id, taken off the entity \
types block rather than from any example. A filter on `stage` is welcome but \
not the measurement; the type id is.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "b8c4e260-1f97-4a53-8e0d-72a5b1c9f483", "title": "2026.8.3", "node_type": "release", "properties": {"version": "2026.8.3", "stage": "cut", "build": "2026.8.3", "owner": "sam"}}], "count": 1}
  """

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id. Use the unquoted id at the start of the RELEVANT ENTITY TYPES line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      [turn.tool.parameters_schema.properties.filters]
      type = "array"
      description = "Field filters. Use the field name and value exactly as listed for the type."

        [turn.tool.parameters_schema.properties.filters.items]
        type = "object"
        required = ["type", "operator", "property", "value"]

          [turn.tool.parameters_schema.properties.filters.items.properties.type]
          type = "string"
          enum = ["property"]

          [turn.tool.parameters_schema.properties.filters.items.properties.operator]
          type = "string"
          enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"]

          [turn.tool.parameters_schema.properties.filters.items.properties.property]
          type = "string"

          [turn.tool.parameters_schema.properties.filters.items.properties.value]
          type = "string"

# ---------------------------------------------------------------------------
# Turn 2 — the write. `soak` cannot be guessed; it must be read.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-stage-to-soak"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- release "Release" -> version: text, required; stage: enum {cut,soak,shipped,rolled_back}, required; build: text; owner: text [title_template: {version}]
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Update
Purpose: Change a field on an existing record when the user describes a new \
state for something that already exists.

CALL update_node NOW: your next action is the tool call, not planning text.

THE ID: use the id from the tool result above, copied exactly.

THE CHANGE: express the new state in `field_values`. When a field lists \
allowed values, pick the one the user's description means and write it \
exactly as listed — the user will rarely say the value aloud.
"""
user = "2026.8.3 is out on staging now, baking overnight before we ship it"
expect = """
update_node(id="b8c4e260-...", field_values={"stage": "soak"}). `soak` is the \
measurement: the user never says the word, it is not guessable from general \
knowledge the way "shipped" would be, and it appears in no example anywhere \
in the prompt. Producing it requires reading the allowed values off the \
entity-types block and matching the description to one. "staging", "baking", \
"testing" or any prettified form is the failure — and so is `shipped`, which \
is the plausible-sounding wrong answer since the user mentions shipping as a \
LATER step.
"""

  [turn.tool_results]
  update_node = '{"ok": true, "updated": ["stage"]}'

  [[turn.tool]]
  name = "update_node"
  description = """
  Update an existing node's fields immediately — call this directly with the \
  node id you already have from a previous tool result. An id on its own \
  changes nothing: every call must also carry the change itself in \
  field_values. Example call: {"id": "a1b2c3d4-...", "field_values": \
  {"status": "in_dev"}}
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]

      [turn.tool.parameters_schema.properties.id]
      type = "string"
      description = "Node id to update — the \"id\" value exactly as it appeared in a tool result. Never the node's title."

      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "The change itself: field keys to new values, e.g. {\"status\": \"done\"}. Use a field the type defines, copied exactly. When a field lists allowed values, use one of those values exactly."
