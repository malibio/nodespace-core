name = "dev-indirect-reference"
reps = 3

notes = """
PRODUCTION-SHAPED. Dev-workflow domain.

Scenario: an indirect reference — "the auth one" — naming a record by
description rather than by title or id, with the referent introduced two turns
earlier and a different record discussed in between.

This is the production-shaped counterpart to `indirect-reference-resolves.toml`,
which is the minimal CONTROL for the same behaviour. Read as a pair: the
control answers "can the model do this under favorable conditions?", this case
answers "does it still do it in the environment NodeSpace actually sends?".
Keeping both is the issue's control-vs-production-shaped requirement, and the
pairing exists because scenario 6 measured 3/3 hand-authored against 0/8 in
production for one task.

WHY THE INTERVENING TURN

The referent is not the most recent thing discussed. Turn 1 surfaces both
tickets, turn 2 acts on the CI one, and turn 3 says "the auth one" — so
resolving by recency alone lands on the wrong record. A case where the
referent is simply the last thing mentioned cannot tell resolution apart from
recency.

THE CONTINUATION GAP

#2118 measured `scenario6-full-sequence` turn 3 calling resolve_query and then
STOPPING, 0/3 byte-identical — the single-turn-pull boundary. This case is
shaped to give that gap somewhere to show: the user's request is a state
change, so resolving alone leaves the work unfinished. Whether the model
continues to the write is the measurement, and both outcomes are informative.

PROVISIONAL ON #2123 — THIS CASE IS NOT PRODUCTION-SHAPED TODAY

Uses `field_values`, not `properties`, because a parameter named `properties`
is silently deleted by the Gemma-4 template. See dev-status-change-enum.toml's
notes for the measurement.

Production says `properties`; this case says `field_values`. So it does not
reproduce production's tool surface and must not be read as validated
production shape. Provisional on #2123 being fixed BY RENAMING, in which case
it becomes correct as written. Fixed any other way, it needs rewriting and
re-measuring rather than re-annotating.

This bears on the continuation finding above: the write completing here was
measured against a parameter the model can see. Under production's current
name the write half of that continuation carries nothing, so "no continuation
gap" is a claim about THIS surface, not about production's.

CONTAMINATION GUARD (#1932)

Dev-workflow vocabulary. Shares no entities with the eval fixtures or with the
minimal controls in this directory.

MEASURED — per-case results recorded on #2122.
"""

# ---------------------------------------------------------------------------
# Turn 1 — two tickets in play.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-list-in-dev"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Search
Purpose: Find, list, or filter existing records by title, type, or stored \
field value.

CALL search_nodes NOW: your next action is the tool call, not planning text.

FILTERING BY FIELD: to narrow by a stored value, pass filters. Copy the type \
id and the field name exactly as they appear in EXISTING SCHEMAS.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "What's in dev right now?"
expect = "search_nodes(node_type=\"ticket\") filtering status to the exact enum member \"in_dev\"."

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "a37f9c15-2e84-4b06-9d73-5c81e6f2a940", "title": "Token refresh returns 401 after idle", "node_type": "ticket", "properties": {"status": "in_dev", "assignee": "dana", "sprint": "S-24"}}, {"id": "4e6b1d80-7a53-49f2-8c15-2b97d4e0f3a6", "title": "CI runner times out on cold cache", "node_type": "ticket", "properties": {"status": "in_dev", "assignee": "sam", "sprint": "S-24"}}], "count": 2}
  """

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id. Use the unquoted id at the start of the EXISTING SCHEMAS line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      [turn.tool.parameters_schema.properties.filters]
      type = "array"
      description = "Field filters. Use the field name and value exactly as listed for the type."

        [turn.tool.parameters_schema.properties.filters.items]
        type = "object"
        required = ["type", "operator", "property", "value"]

          [turn.tool.parameters_schema.properties.filters.items.properties.type]
          type = "string"
          enum = ["property"]

          [turn.tool.parameters_schema.properties.filters.items.properties.operator]
          type = "string"
          enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"]

          [turn.tool.parameters_schema.properties.filters.items.properties.property]
          type = "string"

          [turn.tool.parameters_schema.properties.filters.items.properties.value]
          type = "string"

# ---------------------------------------------------------------------------
