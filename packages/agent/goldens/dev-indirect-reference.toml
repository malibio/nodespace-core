      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "The change itself: field keys to new values, e.g. {\"status\": \"done\"}. Use a field the type defines, copied exactly. When a field lists allowed values, use one of those values exactly."

        [turn.tool.parameters_schema.properties.field_values.properties.status]
        type = "string"
        enum = ["ready_for_dev", "in_dev", "ready_for_review", "in_review", "done"]
        description = "The ticket's workflow state."

        [turn.tool.parameters_schema.properties.field_values.properties.assignee]
        type = "string"
        description = "Who the work is assigned to."

        [turn.tool.parameters_schema.properties.field_values.properties.sprint]
