  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Use only \
  when the record you need is NOT already in this conversation — re-searching \
  for a record already returned above wastes a turn.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id, copied exactly from EXISTING SCHEMAS."
