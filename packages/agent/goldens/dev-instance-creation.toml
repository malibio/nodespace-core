name = "dev-instance-creation"
reps = 3

notes = """
PRODUCTION-SHAPED. Dev-workflow domain.

Scenario: instance creation against a type that already exists. The user
describes ONE ticket with several particulars, and every particular has to
survive into the record.

The failure this case exists to catch is the one the matrix scored as a pass
for years: a create/update call that carries the right tool name and an empty
or partial value map. A ticket created with a title and nothing else reports
success, and the assignee and sprint the user supplied are gone silently.

Note `blocked_by` is NOT a field on the type. The user mentions being blocked
on another ticket, and there is nowhere listed to put it — so the case also
measures whether a value with no matching field is preserved under a key of
the model's own making, or dropped because the schema had no slot for it.
Dropping it is the worse outcome: the user was told the record was saved.

STANDING FAILURE — DIAGNOSED TO A CAPABILITY BOUNDARY, NOT AN UNFOUND WORDING

The listed fields are carried perfectly — node_type, assignee, sprint, and
`status` as the exact enum member, 3/3. The unlisted value is dropped, 3/3.

Six arms were run against it. The first three were restatements of the
obligation and all measured inert:

  1. prose in the candidate instructions ("A VALUE WITH NO MATCHING FIELD:
     still record it ... never drop a value")                    no effect
  2. prose in the field_values schema description                no effect
  3. a worked example carrying an unlisted key `reported_by`     no effect
  4. a worked example rewritten so the extra key is a POINTER to another
     ticket (`depends_on`), structurally parallel to this request, with the
     example's own user sentence shown                           no effect
  5. bounding `content` ("the title and nothing else; facts ABOUT it are
     field_values entries, never appended to the title")         no effect
  6. schema channel: a declared `blocked_by` sub-property on field_values
     whose description names the literal trigger phrase "blocked by or
     depends on"                                                 no effect

Arm 6 was verified present in the post-template prompt before being called a
negative — the lesson from #2123 and the dropped tool-role history is that an
inert-looking channel is often an absent one. It rendered cleanly. (Its
`additionalProperties: true` did NOT survive the template, which is a third
instance of that same silent-drop family and worth knowing independently.)

WHAT THE DIAGNOSTIC PROBES ESTABLISHED

Two probes, each the same request with fewer competing values:

  only the unlisted detail          value PRESERVED, folded into `content`
  one listed field + the unlisted   value PRESERVED, folded into `content`
  three listed fields + unlisted    value GONE

That looked like competition scaling with field count. It is not. The
decisive arm settles it — with the user phrasing changed to name the key
outright, "set blocked_by to the token refresh work":

  ALL FOUR VALUES LAND, 3/3, alongside all three listed fields.

So the model is fully capable of the write, at this field count, with this
tool surface. What it will not do is infer the KEY NAME from natural phrasing:
"it's blocked by X" -> `blocked_by`. Told the key, it complies perfectly; left
to derive it, it drops the value rather than invent a name.

That is the actual boundary, and it is a different claim than "the prompt is
not tuned yet". Every channel ADR-064 defines has now been tried, including
the two that worked elsewhere in this corpus. The remaining lever is not
wording.

IT IS NOT UNAWARENESS, AND IT DOES NOT ASK

Two further probes answer the question a reader will have next: does the model
recognise the shortcoming and raise it, or proceed blind?

  1. HITL AVAILABLE. Same request, plus a route_clarify tool, plus explicit
     permission -- "if a value the user supplied has no field to go in, do not
     silently proceed without it ... saving the record while dropping a value
     tells the user it was stored when it was not."
     STILL create_node, 3/3, no clarification, no mention.

  2. AWARENESS, no write tool offered. Asked in prose to list every particular
     and say whether the type has a field for it, the model answers exactly
     right, unprompted:

       "None of the existing fields -- title, status, assignee, or sprint --
        are designed specifically to capture external dependencies like being
        'blocked by X'."

     It maps the other three correctly and puts "No" against this one in its
     own summary table.

So the model HAS the knowledge and does not act on it. The awareness is
available under a reasoning prompt and absent under an action prompt. This is
the worst of the three possible behaviours: not a comprehension limit, and not
a gap it flags, but a silent drop by a model that could have flagged it.

That also explains why six channels of guidance moved nothing. They all tell
the model something it already knows. The failure is not in what it
understands but in what surfaces while it is acting -- the same shape as this
project's finding that identical guidance delivered as a tool result rather
than in the prompt drops continuation and yields prose.

A PROCEDURAL "DO NOT SKIP" STEP DOES NOT REACH IT EITHER

Arms 1-6 all ASSERTED an obligation. Arm 7 made it an ordered procedure the
model must walk before calling -- STEP 1 enumerate every particular and number
them, STEP 2 name the field for each, STEP 3 count and go back if field_values
has fewer entries than you numbered. Still 3/3 dropped.

Arm 8 then forced that enumeration to be OUTPUT rather than performed
silently, to find out WHERE in the procedure the value is lost. The answer is
that it is lost before the procedure starts. Byte-identical across 3 reps, the
model writes:

  1. ticket: "Ticket"
  2. dana: text (assignee)
  3. flaky retry test: title of the issue/ticket content
  4. sprint S-25: field for 'sprint' on Ticket, ...
  5. ready for dev: status of the ticket

Five items. "blocked by the token refresh work" is not among them -- it never
enters the list at all, and item 1 is the TYPE rather than a particular.

So the model is not skipping the step. The step runs, and the value is already
absent from its input. An instruction to "not skip" cannot help, because it
operates on a list the value never reached. That is why every wording-level
arm has been inert: they all act at a stage downstream of where the loss
occurs.

Note also the cost of this arm: the verbose procedural framing made the model
drift from the listed field name `assignee` to `assigned_to`, so the
enumeration step actively degraded a part that works without it.

Reconciles with the awareness probe rather than contradicting it: asked
DIRECTLY whether the type has a field for the blocking information, the model
answers correctly. Asked to enumerate particulars while preparing a write, the
same detail is not enumerated. The information is retrievable on demand and
absent from the action path -- which is a selection failure, not a knowledge
one, and is not addressable by instruction.

WHY THIS CASE STAYS IN THE CORPUS, STILL FAILING

It is the corpus's honest ceiling marker. A corpus of only passing cases would
imply the assembly line has nothing left to be engineered toward, and this is
precisely the request shape where it does. Note the boundary is narrow and
sits between two things this corpus proves the model CAN do: it selects unseen
enum members by matching a description (dev-unseen-schema, 3/3), and it fills
a named key faultlessly. Only the naming step fails.

Directly relevant to the open question about generated per-schema typed tools:
a tool whose schema declares the field means the model is never asked to
invent the key, which is the one thing measured to fail here. This case is
evidence for that direction rather than merely a defect report.

Not to be conflated with #2123: that defect makes the whole parameter
invisible, so production loses EVERY value on this request, not just the
unlisted one. Two separate failures with two separate fixes.

PROVISIONAL ON #2123 — THIS CASE IS NOT PRODUCTION-SHAPED TODAY

Uses `field_values`, not `properties`, because a parameter named `properties`
is silently deleted by the Gemma-4 template. See dev-status-change-enum.toml's
notes for the measurement.

Production says `properties`; this case says `field_values`. So it does not
reproduce production's tool surface and must not be read as validated
production shape. Provisional on #2123 being fixed BY RENAMING, in which case
it becomes correct as written. Fixed any other way, it needs rewriting and
re-measuring rather than re-annotating.

Worth noting for this case in particular: the standing failure above — the
unlisted value being dropped — is measured against a parameter the model can
SEE. Under production's current `properties` name the whole parameter is
invisible, so the same request there loses every value, not just the unlisted
one. The two failures are separate and must not be conflated when #2123 lands.

CONTAMINATION GUARD (#1932)

Dev-workflow vocabulary. Shares no entities with the eval fixtures or with the
minimal controls in this directory.

MEASURED — per-case results recorded on #2122.
"""

[[turn]]
label = "create-ticket-with-particulars"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Creation
Purpose: Add one new record of a type the workspace already tracks, when the \
user supplies the particulars of a single item rather than describing a new \
kind of thing.

CALL create_node NOW: your next action is the tool call, not planning text.

THE TYPE: set node_type to the id shown in RELEVANT ENTITY TYPES, copied \
exactly.

THE VALUES: put every particular the user supplied into field_values. Work \
through their message value by value and check each against the type's field \
list before calling. field_values is the ONLY way any value is stored — a \
value left out is lost silently while the record still reports as saved.

A VALUE WITH NO MATCHING FIELD: still record it in field_values, under a key \
named after the user's own noun for it, lowercase snake_case. Extra keys are \
stored as given. Never drop a value because the type has no field for it, and \
never reply that the type does not support it.
"""
user = """
File a ticket for dana to fix the flaky retry test in sprint S-25 — it's \
ready for dev, and it's blocked by the token refresh work
"""
expect = """
create_node(node_type="ticket") carrying assignee=dana, sprint=S-25, and \
status="ready_for_dev" as the exact enum member — all measured 3/3. The \
blocked-by detail has no listed field, so the right outcome is a key of the \
model's own making (blocked_by or similar); it is measured DROPPED 3/3 across \
six channels and is a standing failure, not a solved case. Diagnosed: the \
model fills `blocked_by` perfectly when the user NAMES the key, so the \
boundary is inferring a key name from natural phrasing, not the write itself \
— see the notes. The failure this case would still catch is a call with a \
title and little else: it reports success and loses everything the user said.
"""

  [turn.tool_results]
  create_node = '{"ok": true, "id": "9a2f4c81-7d35-4e60-b184-6c93f2a5e07b"}'

  [[turn.tool]]
  name = "create_node"
  description = """
  Create one new record of a type that already exists. Use for a single \
  instance, never to define a new kind of record. The example's user said: \
  "open a ticket for dana to rotate the signing keys on deploy in S-24, it's \
  in dev, and it depends on the vault migration". Note `depends_on`: the type \
  lists no field for it, so it is carried under a key named after the user's \
  own wording rather than dropped. Example call: {"node_type": "ticket", \
  "content": "Rotate signing keys on deploy", "field_values": {"status": \
  "in_dev", "assignee": "dana", "sprint": "S-24", "depends_on": "the vault \
  migration"}}
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["node_type", "content"]

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Type id. Use the unquoted id at the start of the RELEVANT ENTITY TYPES line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      # The diagnostic probe showed the model does not DROP an unlisted detail
      # — it folds it into `content` as extra title text. So the fix belongs
      # here, bounding what content is, rather than in another restatement of
      # "record the value".
      [turn.tool.parameters_schema.properties.content]
      type = "string"
      description = "The record's title and nothing else: the shortest phrase naming what this record IS. Facts ABOUT it — who owns it, what state it is in, what it depends on — are field_values entries, never appended to the title."

      # `additionalProperties` is the schema-channel way to say "keys beyond
      # the listed ones are legal here". Prose asserting the same thing was
      # measured inert across four arms; this states it as structure, which is
      # the channel ADR-064 rule 1 gives argument shape to.
      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "Every value the user supplied, as field keys to values, e.g. {\"status\": \"in_dev\", \"assignee\": \"dana\"}. Use the type's field names exactly as listed. When a field lists allowed values, use one of those values exactly. Keys beyond the type's listed fields are legal and stored as given: name such a key after the user's own noun for the detail (lowercase snake_case). A value omitted here is lost."
      additionalProperties = true

        [turn.tool.parameters_schema.properties.field_values.properties.blocked_by]
        type = "string"
        description = "What this record is waiting on, when the user says one thing is blocked by or depends on another. An example of a key beyond the type's listed fields."

  [[turn.tool]]
  name = "create_schema"
  description = """
  Define a NEW entity type. Use only when the workspace does not already track \
  the kind of record described — never for a single instance of a type that \
  already exists.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["name", "fields"]

      [turn.tool.parameters_schema.properties.name]
      type = "string"

      [turn.tool.parameters_schema.properties.fields]
      type = "array"

        [turn.tool.parameters_schema.properties.fields.items]
        type = "object"
        required = ["name", "type"]

          [turn.tool.parameters_schema.properties.fields.items.properties.name]
          type = "string"

          [turn.tool.parameters_schema.properties.fields.items.properties.type]
          type = "string"
          enum = ["text", "number", "date", "enum", "boolean"]
