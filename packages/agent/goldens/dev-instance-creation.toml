name = "dev-instance-creation"
reps = 3

notes = """
PRODUCTION-SHAPED. Dev-workflow domain.

Scenario: instance creation against a type that already exists. The user
describes ONE ticket with several particulars, and every particular has to
survive into the record.

The failure this case exists to catch is the one the matrix scored as a pass
for years: a create/update call that carries the right tool name and an empty
or partial value map. A ticket created with a title and nothing else reports
success, and the assignee and sprint the user supplied are gone silently.

Note `blocked_by` is NOT a field on the type. The user mentions being blocked
on another ticket, and there is nowhere listed to put it — so the case also
measures whether a value with no matching field is preserved under a key of
the model's own making, or dropped because the schema had no slot for it.
Dropping it is the worse outcome: the user was told the record was saved.

SOLVED BY DECLARING THE FIELD IN THE TOOL SCHEMA, AFTER EIGHT WORDING ARMS

This case is 3/3 — all four particulars land, including `blocked_by`. Getting
there took eight failed arms and one that worked, and the sequence is the
finding, so it is recorded rather than tidied away.

WHAT DID NOT WORK — eight arms, every ADR-064 prose channel:

  1. prose in the candidate instructions ("A VALUE WITH NO MATCHING FIELD:
     still record it ... never drop a value")                    no effect
  2. prose in the field_values schema description                no effect
  3. a worked example carrying an unlisted key `reported_by`     no effect
  4. a worked example whose extra key is a POINTER to other work (`depends_on`),
     structurally parallel to this request                       no effect
  5. bounding `content` ("the title and nothing else; facts ABOUT it are
     field_values entries, never appended to the title")         no effect
  6. a declared `blocked_by` sub-property, but alongside prose still telling
     the model to invent keys for unlisted values                no effect
  7. an ordered PROCEDURE — enumerate every particular, number them, name a
     field for each, count, go back if field_values has fewer    no effect
  8. the same procedure with the enumeration forced to be OUTPUT  no effect

WHY THEY ALL FAILED, MEASURED RATHER THAN GUESSED

Arm 8 shows where the value is lost. The model's own printed enumeration,
byte-identical across 3 reps:

  1. ticket: "Ticket"
  2. dana: text (assignee)
  3. flaky retry test: title of the issue/ticket content
  4. sprint S-25: field for 'sprint' on Ticket, ...
  5. ready for dev: status of the ticket

Five items, and the blocking detail is not among them. It never enters the
list. So the model was never skipping a step — the step ran, and the value was
already absent from its input. Every wording-level arm acts downstream of the
loss, which is why none of them could reach it.

Two probes bound it further. Asked DIRECTLY whether the type has a field for
the blocking information, the model answers correctly and unprompted ("None of
the existing fields — title, status, assignee, or sprint — are designed
specifically to capture external dependencies"). Offered a route_clarify tool
and explicit permission to use it for exactly this situation, it writes the
record anyway, 3/3, mentioning nothing. The knowledge is retrievable on demand
and absent from the action path: a selection failure, not a knowledge one.

WHAT WORKED — the schema declares the field

`blocked_by` is now declared in two places: on the type in RELEVANT ENTITY
TYPES, and as a typed sub-property of `field_values` in the tool schema. The
invent-a-key prose is DELETED, not merely supplemented — arm 6 had the
declaration and that prose together and failed, so the two were competing.

With the field declared and the prose gone, the model fills it 3/3. It never
has to infer a key name, which is the single step measured to fail.

One tightening was needed: the first version returned `{"title": "token
refresh work"}`, an object where the schema says string. Adding "a plain string
naming that work ... not an object" to the field description fixed it 3/3.
Argument shape is the schema channel's own job, per ADR-064 rule 1.

WHAT THIS MEANS FOR THE ASSEMBLY LINE

The working string requires per-field schema declarations, so that is what
production is to be engineered toward. A generic `field_values` object plus
prose explaining how to invent keys is measured NOT to work; the same request
with the fields declared works every time.

That is a concrete argument for generating per-schema tool definitions from
the type's own fields rather than shipping one generic write tool — the
declaration is what carries it, and it can be generated from exactly the same
schema data that already renders the RELEVANT ENTITY TYPES line.

PROVISIONAL ON #2123 — THIS CASE IS NOT PRODUCTION-SHAPED TODAY

Uses `field_values`, not `properties`, because a parameter named `properties`
is silently deleted by the Gemma-4 template. See dev-status-change-enum.toml's
notes for the measurement.

Production says `properties`; this case says `field_values`. So it does not
reproduce production's tool surface and must not be read as validated
production shape. Provisional on #2123 being fixed BY RENAMING, in which case
it becomes correct as written. Fixed any other way, it needs rewriting and
re-measuring rather than re-annotating.

Worth noting for this case in particular: everything measured above — the
eight failed arms AND the declared-field fix that works — is measured against
a parameter the model can SEE. Under production's current `properties` name
the whole parameter is invisible, so the same request there loses every value,
not just the unlisted one, and no schema declaration inside it could be read
either.

So the fix this case establishes is BLOCKED on #2123 rather than merely
annotated by it: declaring fields inside a parameter the template deletes
would change nothing. Fix #2123 first, then this case's shape is reproducible.
The two must not be conflated when it lands.

CONTAMINATION GUARD (#1932)

Dev-workflow vocabulary. Shares no entities with the eval fixtures or with the
minimal controls in this directory.

MEASURED — per-case results recorded on #2122.
"""

[[turn]]
label = "create-ticket-with-particulars"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text; blocked_by: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Creation
Purpose: Add one new record of a type the workspace already tracks, when the \
user supplies the particulars of a single item rather than describing a new \
kind of thing.

CALL create_node NOW: your next action is the tool call, not planning text.

THE TYPE: set node_type to the id shown in RELEVANT ENTITY TYPES, copied \
exactly.

THE VALUES: put every particular the user supplied into field_values. Work \
through their message value by value and check each against the type's field \
list before calling. field_values is the ONLY way any value is stored — a \
value left out is lost silently while the record still reports as saved.
"""
user = """
File a ticket for dana to fix the flaky retry test in sprint S-25 — it's \
ready for dev, and it's blocked by the token refresh work
"""
expect = """
create_node(node_type="ticket") carrying ALL FOUR particulars: assignee=dana, \
sprint=S-25, status="ready_for_dev" as the exact enum member, and \
blocked_by="token refresh work" as a plain string. Measured 3/3.

blocked_by is the one that matters: it was dropped 3/3 across eight \
wording-level arms and only lands once the field is DECLARED in the tool \
schema — see the notes. A call carrying the three listed values but not \
blocked_by is the regression this case exists to catch, and it reports success \
while losing what the user said.
"""

  [turn.tool_results]
  create_node = '{"ok": true, "id": "9a2f4c81-7d35-4e60-b184-6c93f2a5e07b"}'

  [[turn.tool]]
  name = "create_node"
  description = """
  Create one new record of a type that already exists. Use for a single \
  instance, never to define a new kind of record. The example's user said: \
  "open a ticket for dana to rotate the signing keys on deploy in S-24, it's \
  in dev, and it depends on the vault migration". Note `depends_on`: the type \
  lists no field for it, so it is carried under a key named after the user's \
  own wording rather than dropped. Example call: {"node_type": "ticket", \
  "content": "Rotate signing keys on deploy", "field_values": {"status": \
  "in_dev", "assignee": "dana", "sprint": "S-24", "depends_on": "the vault \
  migration"}}
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["node_type", "content"]

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Type id. Use the unquoted id at the start of the RELEVANT ENTITY TYPES line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      # The diagnostic probe showed the model does not DROP an unlisted detail
      # — it folds it into `content` as extra title text. So the fix belongs
      # here, bounding what content is, rather than in another restatement of
      # "record the value".
      [turn.tool.parameters_schema.properties.content]
      type = "string"
      description = "The record's title and nothing else: the shortest phrase naming what this record IS. Facts ABOUT it — who owns it, what state it is in, what it depends on — are field_values entries, never appended to the title."

      # `additionalProperties` is the schema-channel way to say "keys beyond
      # the listed ones are legal here". Prose asserting the same thing was
      # measured inert across four arms; this states it as structure, which is
      # the channel ADR-064 rule 1 gives argument shape to.
      # Every field the type declares is declared HERE too, as a typed
      # sub-property. That is the mechanism that closed this case after eight
      # wording-level arms failed — see the notes.
      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "The values the user supplied, keyed by the type's field names."

        [turn.tool.parameters_schema.properties.field_values.properties.status]
        type = "string"
        enum = ["ready_for_dev", "in_dev", "ready_for_review", "in_review", "done"]

        [turn.tool.parameters_schema.properties.field_values.properties.assignee]
        type = "string"
        description = "Who the work is assigned to."

        [turn.tool.parameters_schema.properties.field_values.properties.sprint]
        type = "string"
        description = "The sprint identifier."

        [turn.tool.parameters_schema.properties.field_values.properties.blocked_by]
        type = "string"
        description = "The work this ticket is waiting on, when the user says it is blocked by or depends on something else. A plain string naming that work, e.g. \"token refresh work\" — not an object."

  [[turn.tool]]
  name = "create_schema"
  description = """
  Define a NEW entity type. Use only when the workspace does not already track \
  the kind of record described — never for a single instance of a type that \
  already exists.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["name", "fields"]

      [turn.tool.parameters_schema.properties.name]
      type = "string"

      [turn.tool.parameters_schema.properties.fields]
      type = "array"

        [turn.tool.parameters_schema.properties.fields.items]
        type = "object"
        required = ["name", "type"]

          [turn.tool.parameters_schema.properties.fields.items.properties.name]
          type = "string"

          [turn.tool.parameters_schema.properties.fields.items.properties.type]
          type = "string"
          enum = ["text", "number", "date", "enum", "boolean"]
