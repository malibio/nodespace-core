name = "scenario6-history-size-vs-style"
reps = 3

notes = """
Ported from golden_scenario6_handauthored.rs, which held three probes on one
question. They are one case here because they are one experiment: each turn is
a point on the same curve, and reading any of them alone is what made the
original file easy to misread.

The three arms, in order, all asking the SAME final question of the SAME model
with the SAME system prompt and tool surface, varying only the history:

  1. medium-verbose  -- ~400-450 tokens, narrative: multi-paragraph assistant
     narration, numbered options, a question back to the user. This is the
     style production traces actually exhibit.
  2. terse-control   -- ~150 tokens, non-narrative: short factual statements.
  3. terse-matched   -- ~400-450 tokens, non-narrative: the same terse style as
     arm 2, extended with further true facts to match arm 1's token count.

Arm 3 is the controlled probe: token count matched to arm 1, style matched to
arm 2. If it fails, size is implicated. If it passes, style is -- meaning
history should be compacted into terse facts, not into shorter narrative
summaries, which is a concrete design consequence either way.

All three are `observe`: they were authored as discriminating experiments with
no known-correct answer, and an assertion here would convert a finding into a
failure. The printed outcomes are the result.

MEASURED, 3/3 each, byte-identical across reps on the locked native model:

  terse-control-150t       resolve_query(node_type="equipment_item",
                             request="The 2400 one came back")           RESOLVES
  medium-verbose-412t      no tool call -- "I need a little more information
                             ... which specific 'Laser Cutter' node ...?"  REFUSES
  terse-matched-size-412t  resolve_query(node_type="equipment_item",
                             request="The 2400 one")                      RESOLVES

STYLE, not size. Arm 3 matches arm 1's token count and arm 2's style, and it
resolves -- so the ~412-token break point is not a function of length. Arm 1's
failure is driven by narrative shape: paragraphs, numbered options, and a
question back to the user, which is the style production traces exhibit.

The design consequence is concrete and directional: carried-forward history
should be compacted into terse factual statements, not into shorter narrative
summaries. A "concise summary" that stays conversational reproduces arm 1 at a
smaller size; the same facts as flat assertions do not.

Note what arm 1 does when it fails -- it asks for a node id in prose rather
than calling a clarification tool. That is a second, separable defect visible
in the same run, and worth its own case rather than being folded into this
one.

Every arm sets `chain = false`. That is load-bearing, not decoration: the
runner's default is to feed each turn the real output of the turns before it
(see scenario6-full-sequence.toml, where that is the whole point), and here
that would contaminate every arm with the previous arm's history -- destroying
the one variable each arm isolates. `chain = false` also means an arm that
fails does not cut the rep, so one arm's outcome never suppresses another's.
"""

# ---------------------------------------------------------------------------
# Arm 2 first (terse control, smallest): the known-passing reference point.
# ---------------------------------------------------------------------------
[[turn]]
chain = false
label = "terse-control-150t"
system = """
You are a graph-editing assistant. When a request refers to something \
indirectly (a bare value, a description) rather than by name, call \
resolve_query to find it. Never ask the user to supply a node id yourself.
"""
user = "The 2400 one came back — set it to returned"

  [[turn.history]]
  role = "system"
  content = "Fact: an 'equipment' schema was created with fields: replacement_cost (number)."
  [[turn.history]]
  role = "system"
  content = "Fact: no other schemas were created in this conversation."
  [[turn.history]]
  role = "system"
  content = "Fact: one equipment_item node was created."
  [[turn.history]]
  role = "system"
  content = "Fact: that node's replacement_cost is 2400."
  [[turn.history]]
  role = "system"
  content = "Fact: that node's title is 'Laser Cutter'."
  [[turn.history]]
  role = "system"
  content = "Fact: no other equipment_item nodes exist yet."
  [[turn.history]]
  role = "system"
  content = "Fact: the equipment schema has exactly one field: replacement_cost."
  [[turn.history]]
  role = "system"
  content = "Fact: the laser cutter was logged as checked out, no status field exists yet."
  [[turn.history]]
  role = "system"
  content = "Fact: node ids are assigned automatically and are not known to the user."
  [[turn.history]]
  role = "system"
  content = "Fact: the user refers to items by their replacement_cost value, not by id."

  [[turn.tool]]
  name = "resolve_query"
  description = """
  Resolve an indirect reference (a bare value, a relative date, a description) \
  to the single node it refers to. Returns the node directly -- do not call \
  search_nodes afterward.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["request", "node_type"]
      [turn.tool.parameters_schema.properties.request]
      type = "string"
      description = "The user's request, verbatim."
      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "The target node type id."

  [[turn.tool]]
  name = "update_node"
  description = "Update an existing node's properties, given its id."
    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]
    properties = { id = { type = "string" }, properties = { type = "object" } }

  [turn.expect]
  kind = "observe"

# ---------------------------------------------------------------------------
# Arm 1: verbose/narrative at ~400-450 tokens.
# ---------------------------------------------------------------------------
[[turn]]
chain = false
label = "medium-verbose-412t"
system = """
You are a graph-editing assistant. When a request refers to something \
indirectly (a bare value, a description) rather than by name, call \
resolve_query to find it. Never ask the user to supply a node id yourself.
"""
user = "The 2400 one came back — set it to returned"

  [[turn.history]]
  role = "user"
  content = """
  I want to keep a record of the equipment my team checks out and what each \
  item costs to replace
  """

  [[turn.history]]
  role = "assistant"
  content = """
  I've created the schema for **Equipment Item** (equipment_item) to track what you have. \
  For tracking checkouts, I also tried to create a second type called "Equipment Checkout \
  Record," but it seems like creating multiple schemas in one go is restricted by my current \
  tools.

  To best capture your needs -- tracking an item *and* its checkout status/cost -- we should \
  use just one type for now:
  1. **`equipment_item`**: To store details about each piece of equipment and its replacement \
  cost.

  The schema now has a single field: replacement_cost (number). You can log items against it \
  whenever you're ready, and we can always add more fields later such as a status field for \
  checked-out vs returned, a location field, or a purchase-date field if that would be useful \
  for your team's tracking needs going forward.
  """

  [[turn.history]]
  role = "system"
  content = """
  Record of graph writes already completed in the previous turn. These are done -- do not \
  repeat them:
  - create_schema "Equipment Item" -> nodespace://a1b2c3d4-1111-2222-3333-444455556666
  """

  [[turn.history]]
  role = "user"
  content = "Log a laser cutter checked out on the 12th, replacement cost 2400"

  [[turn.history]]
  role = "assistant"
  content = """
  I've logged the laser cutter as a new Equipment Item with a replacement cost of 2400. The \
  record now exists in your graph and you can reference it going forward -- for example, if \
  it's ever checked back in, damaged, or needs a cost update, just let me know and I can look \
  it up and make the change for you directly.
  """

  [[turn.history]]
  role = "system"
  content = """
  Record of graph writes already completed in the previous turn. These are done -- do not \
  repeat them:
  - create_node "Laser Cutter" -> nodespace://b2c3d4e5-2222-3333-4444-555566667777
  """

  [[turn.tool]]
  name = "resolve_query"
  description = """
  Resolve an indirect reference (a bare value, a relative date, a description) \
  to the single node it refers to. Returns the node directly -- do not call \
  search_nodes afterward.
  """
    [turn.tool.parameters_schema]
    type = "object"
    required = ["request", "node_type"]
      [turn.tool.parameters_schema.properties.request]
      type = "string"
      description = "The user's request, verbatim."
      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "The target node type id."

  [[turn.tool]]
  name = "update_node"
  description = "Update an existing node's properties, given its id."
    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]
    properties = { id = { type = "string" }, properties = { type = "object" } }

  [turn.expect]
  kind = "observe"

