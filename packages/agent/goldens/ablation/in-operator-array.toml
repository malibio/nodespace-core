name = "in-operator-array"
# derived-from: ../dev-unseen-schema.toml — differs by exactly one change:
# turn 1's `search_nodes.filters.items.properties.value` is declared the way
# PRODUCTION declares it (`tools.rs` ~443: a type union naming `array`, and a
# description saying "Use array for 'in' operator") instead of the parent
# case's bare `type = "string"`. Everything else — both turns' system prompts,
# the user messages, the tool results, turn 2 entirely — is byte-identical.
reps = 3

notes = """
ABLATION ARM. Built by replacing exactly one declaration in dev-unseen-schema.toml.

core#2182: when the model chooses the `in` operator, does it send `value` as an
array?

WHY THE PARENT CASE COULD NOT ANSWER THIS

dev-unseen-schema.toml declares `value` as a bare `type = "string"`. So the
comma-joined `"cut,soak"` the issue reports is, on that case, SCHEMA-COMPLIANT
OUTPUT: the corpus asked for a string and the model sent a string. Measuring the
issue's question there measures the corpus's own defect, not production's.

Production declares the union `["string", "number", "boolean", "array"]` with
"Use array for 'in' operator." in the description. This arm carries that exact
declaration so the question being asked is production's.

WHAT THIS ARM IS AND IS NOT EVIDENCE FOR

It is a FIDELITY fix to the measurement, not a fix to the defect. The fix for
the defect is `repair_scalar_in_operator_values` in `agent_loop.rs`, which is a
transform on the emitted arguments and changes NO prompt bytes — it therefore
cannot be what moves this arm's result, and cannot regress a sibling case.

That separation is why the runner now prints the raw emission beside the
repaired arguments whenever repair changed something. Without it, this arm's
output would read as a clean pass in the exact case where the model still emits
a malformation and production quietly fixes it — which is the ONE distinction
this arm exists to make. Read the `[emitted, before repair: …]` half, not the
first half, when judging whether the DECLARATION moved anything.

WHY NOT A PROSE ARM

Measured already, and recorded on core#2182: a third statement of the rule
("an operator taking several values takes them as a list") changed nothing on
this case at 3 reps and made dev-status-change-enum WORSE — the model emitted
Gemma's internal call syntax as raw text rather than a JSON tool call. Two
channels already state the rule. A third is not free.

RESULT, measured via `./target/release/golden_runner --reps 3` (3/3 identical):

  turn 1   search_nodes({"node_type":"release","query":"open"})

NO FILTERS AT ALL. So no `in`, no `value`, and the declaration under test was
never exercised — this arm cannot answer the question it was built to ask, and
the honest reading is "did not reach the measurement", not "passed".

That is still a finding, and the more useful of the two: on the phrasing the
issue names, the locked model does not reach for a multi-value filter, it
reaches for a keyword query. It also means the issue's reported output
("value":"cut,soak") did not come from goldens/dev-unseen-schema.toml as
committed. Something in the prompt that produced it pushed the model toward
filters first — most likely the filter-construction rule from the third,
uncommitted arm.

turn 2 unchanged (`{"stage":"soak"}`, 3/3).

Continued in in-operator-array-elicited.toml, which changes only the user
message so a multi-value filter is actually elicited.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the release. THE ARM'S QUESTION. Only this turn's `value`
# declaration differs from dev-unseen-schema.toml.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-release"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- release "Release" -> version: text, required; stage: enum {cut,soak,shipped,rolled_back}, required; build: text; owner: text [title_template: {version}]
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Search
Purpose: Find, list, or filter existing records by title, type, or stored \
field value.

CALL search_nodes NOW: your next action is the tool call, not planning text.

LISTING BY TYPE: to list every record of a type, use an empty query with \
node_type set.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- release "Release" -> version: text, required; stage: enum {cut,soak,shipped,rolled_back}, required; build: text; owner: text [title_template: {version}]
"""
user = "What releases do we have open?"
expect = """
search_nodes(node_type="release"). THE ARM'S MEASUREMENT is what `value` looks \
like IF the model chooses the `in` operator to express "open" as more than one \
stage: an array (["cut","soak"]) is the pass, the comma-joined string \
("cut,soak") is the failure core#2182 reports. Read the `[emitted, before \
repair: …]` half — the first half is post-repair and would show an array \
either way. A filter the model declines to write at all is neither result; \
say so rather than scoring it.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "b8c4e260-1f97-4a53-8e0d-72a5b1c9f483", "title": "2026.8.3", "node_type": "release", "properties": {"version": "2026.8.3", "stage": "cut", "build": "2026.8.3", "owner": "sam"}}], "count": 1}
  """

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id. Use the unquoted id at the start of the EXISTING SCHEMAS line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      [turn.tool.parameters_schema.properties.filters]
      type = "array"
      description = "Field filters. Use the field name and value exactly as listed for the type."

        [turn.tool.parameters_schema.properties.filters.items]
        type = "object"
        required = ["type", "operator", "property", "value"]

          [turn.tool.parameters_schema.properties.filters.items.properties.type]
          type = "string"
          enum = ["property"]

          [turn.tool.parameters_schema.properties.filters.items.properties.operator]
          type = "string"
          enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"]

          [turn.tool.parameters_schema.properties.filters.items.properties.property]
          type = "string"

          # THE ARM'S ONE CHANGE, relative to dev-unseen-schema.toml, which
          # declares this `type = "string"` with no description. Copied from
          # production's own declaration in `tools.rs` so the arm asks
          # production's question: both the type union naming `array` and the
          # sentence pointing `in` at it are present, exactly as they are in
          # the shipping tool schema.
          [turn.tool.parameters_schema.properties.filters.items.properties.value]
          type = ["string", "number", "boolean", "array"]
          description = "Value to compare against. Use string for dates (YYYY-MM-DD), string/number for others. Use array for 'in' operator."

# ---------------------------------------------------------------------------
# Turn 2 — the write. UNCHANGED from dev-unseen-schema.toml — not this arm's
# question. Kept only so turn 1 is measured inside the same two-turn shape,
# and so a reader can confirm nothing else drifted.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-stage-to-soak"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- release "Release" -> version: text, required; stage: enum {cut,soak,shipped,rolled_back}, required; build: text; owner: text [title_template: {version}]
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Update
Purpose: Change a field on an existing record when the user describes a new \
state for something that already exists.

CALL update_node NOW: your next action is the tool call, not planning text.

THE ID: use the id from the tool result above, copied exactly.

THE CHANGE: express the new state in `field_values`. When a field lists \
allowed values, pick the one the user's description means and write it \
exactly as listed — the user will rarely say the value aloud.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- release "Release" -> version: text, required; stage: enum {cut,soak,shipped,rolled_back}, required; build: text; owner: text [title_template: {version}]
"""
user = "2026.8.3 is out on staging now, baking overnight before we ship it"
expect = """
update_node(id="b8c4e260-...", field_values={"stage": "soak"}). Not this arm's \
question — unchanged from dev-unseen-schema.toml, and present only so turn 1 \
is measured in the same shape. A change here relative to the parent case would \
mean something other than the one intended declaration drifted.
"""

  [turn.tool_results]
  update_node = '{"ok": true, "updated": ["stage"]}'

  [[turn.tool]]
  name = "update_node"
  description = """
  Update an existing node's fields immediately — call this directly with the \
  node id you already have from a previous tool result. An id on its own \
  changes nothing: every call must also carry the change itself in \
  field_values. Example call: {"id": "a1b2c3d4-...", "field_values": \
  {"status": "in_dev"}}
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]

      [turn.tool.parameters_schema.properties.id]
      type = "string"
      description = "Node id to update — the \"id\" value exactly as it appeared in a tool result. Never the node's title."

      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "The change itself: field keys to new values. Send only the keys that change."

        [turn.tool.parameters_schema.properties.field_values.properties.stage]
        type = "string"
        enum = ["cut", "soak", "shipped", "rolled_back"]
        description = "The release's lifecycle stage."

        [turn.tool.parameters_schema.properties.field_values.properties.version]
        type = "string"
        description = "The release version."

        [turn.tool.parameters_schema.properties.field_values.properties.build]
        type = "string"
        description = "The build identifier."

        [turn.tool.parameters_schema.properties.field_values.properties.owner]
        type = "string"
        description = "Who owns the release."
