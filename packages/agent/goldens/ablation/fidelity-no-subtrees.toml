# derived-from: production-baseline.toml -- the honest 9-tool/3-candidate reference.
name = "fidelity-no-subtrees"
reps = 5

notes = """
ARM A -- re-tests the "candidate block is inert" finding at production fidelity.

ablation/no-instruction-subtree.toml concluded the instruction subtrees are
inert, but measured that with ONE tool and ONE candidate on offer. Disambiguating
among nine tools and three competing procedures is the block's actual job, so
inertness has never been tested where it would matter.

This arm keeps all three candidates' names and Purpose lines and drops only
their instruction subtrees. Tool surface unchanged at 9.

A TIE with the baseline means ~4KB of subtree is buying nothing even at real
fidelity, and can simply be deleted -- no new mechanism needed.

Baseline to compare against: production-baseline.toml, 5/5 byte-identical --
turn 1 search_nodes with node_type "ticket" and a status filter of the exact
enum member "in_dev"; turn 2 update_node with the uuid from turn 1's tool
result plus field_values={"status": "ready_for_review"}.

A difference inside one rep is noise. Identical code has scored 6/7/7 on the
agent matrix.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the ticket. Exists so turn 2's id is a real tool result.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-ticket"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Creation
Purpose: Create new nodes, records, entries, or instances of any type — tasks, text notes, or custom types like Spec, ADR, Ticket. Use when user wants to add, create, or insert a new item, record, entry, or example of an existing type.

--- Candidate 2: Graph Editing
Purpose: Modify existing nodes in the knowledge graph - update content, properties, titles, and metadata. For tasks, use update_task_status to change status.

--- Candidate 3: Relationship Management
Purpose: Create connections between nodes, explore relationships, and traverse the knowledge graph.
"""
user = "Which tickets are still in dev?"
expect = """
search_nodes(node_type="ticket", ...) filtering status to the exact enum \
member "in_dev" — not "in dev", not "In Dev". A title-text query instead of a \
status filter is the miss worth noting.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "7f3a1c92-4b6e-4d18-9a05-2e7c8b4f1d63", "title": "Token refresh returns 401 after idle", "node_type": "ticket", "properties": {"status": "in_dev", "assignee": "dana", "sprint": "S-24"}}], "count": 1}
