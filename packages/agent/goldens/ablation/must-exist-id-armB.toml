# hand-authored: fresh case for core#2190, tool descriptions copied verbatim
# from packages/agent/src/local_agent/tools.rs at generation time (create_node
# lines ~811, create_schema.relationships.targetType ~1208, update_schema
# .schema_id ~1231).
name = "must-exist-id-armB"
reps = 3

notes = """
CORE#2190 -- THE THREE SURVIVING 'adr' EXAMPLES, MEASURED

core#2188 removed create_schema's `name` example ("Ticket", "ADR") after it
caused the model to name a newly-CREATED type "ADR" on a request that never
abbreviated. Three other model-facing descriptions still carry the token:

  create_node.node_type              (e.g. 'ticket', 'adr')
  create_schema.relationships.targetType  (e.g., 'task', 'ticket', 'adr')
  update_schema.schema_id            (e.g. 'ticket', 'adr')

#2188's review predicted these are a DIFFERENT case: each names an id that
must ALREADY EXIST (the model copies it from EXISTING SCHEMAS, it does not
invent one), so the example illustrates a format rather than supplying a
value to adopt. Untested until this case.

WHY THIS CASE, NOT dev-schema-creation

dev-schema-creation tests the CREATE-a-new-name case (already fixed, #2188).
Reusing its exact text would also violate the contamination guard (#1932) --
this corpus's own arms must not share prompt text with an already-measured
one. This case is fresh: different type id, different field shape naming, own
wording throughout.

THE TYPE: `arch_decision` -- ADR-SHAPED ON PURPOSE

EXISTING SCHEMAS lists a type whose id is `arch_decision`, NOT `adr`, but whose
concept (a record of an engineering/architecture call, status
proposed/accepted/superseded) is exactly what "ADR" abbreviates and exactly
the shape the survivors' own example token names. That is the sharpest
available test: if the model ever emits the literal id "adr" in a tool call on
this case, it did not come from EXISTING SCHEMAS -- there is no such id there
-- so it can only have come from the schema description's own worked example.
The user's messages describe the concept in their own words ("architecture
call", "engineering call") and never write "ADR" or "adr" anywhere.

THREE TURNS, ONE WORKFLOW -- not three unrelated probes in one file

case.rs's own doc warns that independent probes belong in separate files
because turns chain real history. These three are not independent: they are
one coherent developer session (log an instance of an existing type -> add a
new type that relates to it -> update the existing type), so chaining is the
right shape, matching dev-relationship-creation-minimal.toml's own two-turn
setup+measurement pattern. Turn 3 doubles as a recency-bias check: it asks to
update "the architecture call type" right after turn 2 introduced a new
`review` type, so a schema_id of "review" is also a distinguishable wrong
answer, not just "adr".

WHAT COUNTS AS CONTAMINATION, PER TURN

  turn 1  create_node.node_type      != "arch_decision" (esp. "adr")
  turn 2  relationships[].targetType != "arch_decision" (esp. "adr")
  turn 3  update_schema.schema_id    != "arch_decision" (esp. "adr", or "review")

REVERSE-PREDICTION READING (per the issue's explicit ask)

This same baseline, compared against must-exist-id-armA (neutral 'my_type'
example) and must-exist-id-armB (example deleted outright), gives the reverse
signal for free: if id-copying is clean in the baseline but degrades (wrong
id, malformed snake_case, or a novel error) in armB, that confirms an example
in a must-exist description was doing real format-illustrating work. If
armB ties the baseline, the reverse prediction is refuted too -- the example
was inert.

TURN 2 ELICITATION -- what it took to reach the parameter under test

Not the survivor's fault, recorded for whoever edits this case next. Three
phrasings failed to get the model to touch `relationships` at all, each a
DIFFERENT failure mode (9 attempts, 3 reps each, all before the survivor
question could even be asked):
  1. "one architecture call" + a RELATIONSHIP_VS_FIELD-style guidance line ->
     a FIELD named "evaluates" with an invented type "relationship" (not in
     the type enum), 3/3.
  2. Same scenario, guidance line strengthened with an explicit "even a single
     reference belongs in relationships, never a field" sentence -> malformed,
     unparseable tool-call JSON, 3/3 -- off-topic-feeling prose in the slot
     making things worse, the same signature section 4 of FINDINGS.toml
     already documents for a different case.
  3. A named relationship alongside an explicit scalar field ("notes") ->
     the relationship silently DROPPED, only the field emitted, 3/3.
  4. "no fields ... reviews can evaluate MULTIPLE ... give it a relationship" —
     matching create_schema's own relationships description ("Use instead of
     ARRAY fields") with a cardinality-many framing and nothing competing for
     the call -> relationships[].targetType reached cleanly, 3/3, confirmed
     both in isolation and inside the full three-turn chain.
Read: this small model reaches create_schema's relationships mechanism
reliably only when the request is unambiguously many-cardinality and asks for
nothing else in the same call. That is a general elicitation fact about this
tool surface, worth flagging separately; it is not part of core#2190's own
question and no issue is filed for it here per the scope instruction for this
session.

RESULT -- MEASURED, NEGATIVE ON BOTH THE FORWARD AND REVERSE PREDICTION

All three arms run at 3 reps each, byte-identical within an arm, real native
inference (gemma-4-E4B-it-Q4_K_M) via golden_runner:

  arm          node_type       targetType      schema_id       total
  baseline     arch_decision   arch_decision   arch_decision   9/9 correct
    (current text, 'adr' present in all three descriptions)
  armA         arch_decision   arch_decision   arch_decision   9/9 correct
    ('adr' replaced with neutral 'my_type')
  armB         arch_decision   arch_decision   arch_decision   9/9 correct
    ('adr' example deleted outright, no replacement)

FORWARD PREDICTION (do the survivors contaminate?): NO. The literal token
"adr" never appeared in a single one of 27 tool calls (3 arms x 3 turns x 3
reps), despite a type (`arch_decision`) and a request wording ("architecture
call", "engineering call") deliberately chosen to be as close to the literal
concept "ADR" abbreviates as possible without ever writing "ADR" or "adr". No
recency-bias confusion with the `review` type either (turn 3, all arms).

REVERSE PREDICTION (does removing the example hurt id-copying?): ALSO NO.
armB is byte-for-byte identical in outcome to baseline and armA across all 9
measurements. The example is not merely non-contaminating; on this case it is
fully inert in both directions -- neither a source of a wrong answer nor a
prop the model needs to get the right one. The "copy exactly ... never
shorten, singularize, paraphrase, or guess" instruction (create_node) and the
EXISTING SCHEMAS block itself (which already displays every id in its correct
lowercase-snake_case form) appear to be doing all the real work; the
parenthetical example rides on top of both, contributing nothing measurable
either way.

This confirms #2188's prediction (each survivor names an id that must already
exist, so its example illustrates format rather than offering a value to
adopt) but goes one step further than the prediction itself claimed: it is not
that they illustrate format INSTEAD of contaminating -- on this case they do
not even illustrate format in any way that changes behavior when withdrawn.

CAVEATS

- One case, one model, one concept (`arch_decision`). Turn 2's targetType
  measurement required trial-and-error to reach (see "TURN 2 ELICITATION"
  above) and holds only for a many-cardinality, single-purpose relationship
  request -- the elicitation difficulty itself is a separate, unfiled
  observation about create_schema's relationships mechanism, not about the
  survivor.
- A tie at 9/9 in a small sample cannot rule out a low-frequency effect --
  this is the same "not decision-grade from one run" caveat this corpus
  applies everywhere, mitigated here by running the SAME case at 3 reps in
  each of 3 arms (27 total calls) rather than one arm alone.
- No code changed as a result. Per the issue's own instruction, a clean
  negative result across both directions is a complete outcome: doctrine is
  proposed instead of a removal. See FINDINGS.toml section 6A.
"""

# ---------------------------------------------------------------------------
# Turn 1 -- create_node.node_type. Correct copy: "arch_decision".
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-log-existing-type-instance"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- arch_decision "Arch Decision" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Creation
Purpose: Add one new record of a type the workspace already tracks, when the \
user supplies the particulars of a single item rather than describing a new \
kind of thing.
"""
user = """
We picked event-based cache invalidation over the old TTL-based approach — \
write up that architecture call, status accepted.
"""
expect = """
create_node(node_type="arch_decision", content=<about the cache-invalidation \
switch>, field_values={"status":"accepted"}). The failure this turn exists to \
catch: node_type "adr" -- a type absent from EXISTING SCHEMAS, which \
create_node's own description says not to invent.
"""

  [turn.tool_results]
  create_node = '{"ok": true, "id": "b1b6c9a2-4e77-4a2d-9c1f-7a3e5d8b6f10"}'

  [[turn.tool]]
  name = "create_node"
  description = """
  Create one new record of a type that already exists. Use for a single \
  instance, never to define a new kind of record.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["node_type", "content"]

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Node type: 'text', 'task', or a custom schema ID. For a custom schema ID, copy the id exactly from the EXISTING SCHEMAS block — character for character, including underscores — never shorten, singularize, paraphrase, or guess it from the user's wording. If the type is not listed there, it does not exist yet — do not invent an id for it."

      [turn.tool.parameters_schema.properties.content]
      type = "string"
      description = "The record's title and nothing else."

      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "Field values for this record, keyed by the type's field names."

        [turn.tool.parameters_schema.properties.field_values.properties.status]
        type = "string"
        enum = ["proposed", "accepted", "superseded"]

  [[turn.tool]]
  name = "create_schema"
  description = """
  Define a NEW entity type. Use only when the workspace does not already track \
  the kind of record described — never for a single instance of a type that \
  already exists.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["name", "fields"]

      [turn.tool.parameters_schema.properties.name]
      type = "string"

      [turn.tool.parameters_schema.properties.fields]
      type = "array"

# ---------------------------------------------------------------------------
# Turn 2 -- create_schema.relationships.targetType. Correct copy: "arch_decision".
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-new-type-relates-back"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- arch_decision "Arch Decision" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Schema Creation
Purpose: Define a new kind of record the workspace does not track yet, when \
the user describes a category of thing rather than one particular instance.

The targetType MUST be an existing schema ID from the EXISTING SCHEMAS list in \
the system prompt — do NOT invent types that aren't listed. If the target \
type doesn't exist yet, omit the relationship entirely.

RELATIONSHIPS: Use relationships (not fields) when a field references another \
node type.
"""
user = """
Add a 'review' type, no fields — reviews can evaluate multiple of those \
architecture calls from before, so give it a relationship named 'evaluates'.
"""
expect = """
create_schema(name="Review", fields=[], relationships=[{"name": "evaluates" \
(or similar), "targetType": "arch_decision", "direction": "out", \
"cardinality": "many"}]). The failure this turn exists to catch: targetType \
"adr" -- absent from EXISTING SCHEMAS, invented rather than copied. A field \
instead of a relationship, or the relationship dropped entirely, is a \
different, already-tracked failure mode (RELATIONSHIP_VS_FIELD / elicitation) \
and not what this case measures -- see the notes for the three phrasings that \
failed to reach this parameter before a "no fields, cardinality many" framing \
reached it reliably.
"""

  [turn.tool_results]
  create_schema = '{"ok": true, "type_id": "review", "note": "Type created. The id is derived from the name: lowercased, spaces to underscores."}'

  [[turn.tool]]
  name = "create_schema"
  description = """
  Define a new entity type with its fields. Use when the user describes a kind \
  of record the workspace does not track yet, not a single instance of an \
  existing kind. The example shows one field per detail the user mentioned, \
  including a pointer at another record (e.g. "blocks another ticket") as a \
  field rather than a second type. Example call: {"name": "Ticket", "fields": \
  [{"name": "status", "type": "enum", "required": true, "coreValues": \
  [{"value": "ready_for_dev", "label": "Ready for Dev"}, {"value": "in_dev", \
  "label": "In Dev"}, {"value": "done", "label": "Done"}]}, {"name": \
  "assignee", "type": "text"}]}.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["name", "fields"]

      [turn.tool.parameters_schema.properties.name]
      type = "string"
      description = "Display name for the entity type, in the user's own words, singular."

      [turn.tool.parameters_schema.properties.fields]
      type = "array"
      description = "Every field this type needs. Do not include a title or name field."

        [turn.tool.parameters_schema.properties.fields.items]
        type = "object"
        required = ["name", "type"]

          [turn.tool.parameters_schema.properties.fields.items.properties.name]
          type = "string"

          [turn.tool.parameters_schema.properties.fields.items.properties.type]
          type = "string"
          enum = ["text", "number", "date", "enum", "boolean"]

      [turn.tool.parameters_schema.properties.relationships]
      type = "array"
      description = "Relationships to other node types. Use instead of array fields when referencing existing types (e.g., ticket has_task task)."

        [turn.tool.parameters_schema.properties.relationships.items]
        type = "object"
        required = ["name", "targetType", "direction", "cardinality"]

          [turn.tool.parameters_schema.properties.relationships.items.properties.name]
          type = "string"
          description = "Relationship name, lowercase snake_case (e.g. 'supersedes', 'blocks', 'assigned_to')"

          [turn.tool.parameters_schema.properties.relationships.items.properties.targetType]
          type = "string"
          description = "Target node type ID — MUST be an existing type from the EXISTING SCHEMAS list. Do NOT invent types that don't exist yet."

          [turn.tool.parameters_schema.properties.relationships.items.properties.direction]
          type = "string"
          enum = ["out", "in"]

          [turn.tool.parameters_schema.properties.relationships.items.properties.cardinality]
          type = "string"
          enum = ["one", "many"]

  [[turn.tool]]
  name = "update_schema"
  description = """
  Modify an existing schema type: add/remove/rename fields, add/remove \
  relationships, update description or title_template.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["schema_id"]

      [turn.tool.parameters_schema.properties.schema_id]
      type = "string"
      description = "ID of the schema to update"

# ---------------------------------------------------------------------------
# Turn 3 -- update_schema.schema_id. Correct copy: "arch_decision" (not "review").
# ---------------------------------------------------------------------------
[[turn]]
label = "turn3-update-existing-type"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- arch_decision "Arch Decision" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text
- review "Review" -> title: text, required

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Schema Creation
Purpose: Modify an entity type's own definition — add or remove fields, add \
or remove relationships — as distinct from creating a brand-new type.
"""
user = """
Add a 'reviewer' text field to the architecture call type.
"""
expect = """
update_schema(schema_id="arch_decision", add_fields=[{"name": "reviewer", \
"type": "text"}]). Two failures worth telling apart: schema_id "adr" \
(contamination — invented, absent from EXISTING SCHEMAS) and schema_id \
"review" (recency bias — the type this same conversation just created in turn \
2, but not the one this request names).
"""

  [turn.tool_results]
  update_schema = '{"ok": true}'

  [[turn.tool]]
  name = "update_schema"
  description = """
  Modify an existing schema type: add/remove/rename fields, relabel a field's \
  display name without renaming it, add/remove relationships, update \
  description or title_template. Use rename_fields to rename a field's \
  storage key — it migrates all existing node property data to the new key \
  and updates the schema definition; the same rename_fields list also handles \
  a display-only relabel (see its own description for the difference).
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["schema_id"]

      [turn.tool.parameters_schema.properties.schema_id]
      type = "string"
      description = "ID of the schema to update"

      [turn.tool.parameters_schema.properties.add_fields]
      type = "array"
      description = "New fields to add to the schema."

        [turn.tool.parameters_schema.properties.add_fields.items]
        type = "object"
        required = ["name", "type"]

          [turn.tool.parameters_schema.properties.add_fields.items.properties.name]
          type = "string"
          description = "Field name, lowercase snake_case."

          [turn.tool.parameters_schema.properties.add_fields.items.properties.type]
          type = "string"
          enum = ["text", "number", "date", "enum", "boolean"]

  [[turn.tool]]
  name = "create_schema"
  description = """
  Define a NEW entity type. Use only when the workspace does not already track \
  the kind of record described — never for a single instance of a type that \
  already exists.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["name", "fields"]

      [turn.tool.parameters_schema.properties.name]
      type = "string"

      [turn.tool.parameters_schema.properties.fields]
      type = "array"
