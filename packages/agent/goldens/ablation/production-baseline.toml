# derived-from: full-tool-surface.toml, itself derived from dev-status-change-enum.toml.
name = "production-baseline"
reps = 5

notes = """
ABLATION ARM -- the honest production baseline. Real 9-tool surface AND the real
three-candidate Stage-2 block, both captured from a live daemon turn.

WHY THIS ARM EXISTS

full-tool-surface.toml fixed the tool surface but kept the base case's single
hand-authored candidate, reaching 7,233 chars against production's 24,636. The
remaining gap was the candidate block: the base carries one clean candidate
(~1KB), production sent three (~6KB) whose guidance actively competes -- one of
them (Relationship Management) instructs the model to call create_relationship
on a turn that wants an update.

This arm substitutes that real block, so the prompt matches what production
sends on both axes that were wrong.

WHAT IT TESTS

The condition under which ablation/no-candidate-block.toml and
ablation/no-instruction-subtree.toml concluded the Stage-2 candidate block is
inert. That conclusion was measured with a single candidate and a single tool
on offer -- neither competing tools nor competing procedures. Disambiguating
among several of both is the block's actual job, so its inertness has never
been tested where it would matter.

Compare against full-tool-surface.toml (5/5, 9 tools, one candidate) to isolate
what the extra two candidates cost or buy. Compare against the base
dev-status-change-enum.toml (5/5, one tool, one candidate) for the full delta.

HOW IT IS BUILT

Candidate block: verbatim from a NODESPACE_PROMPT_DUMP capture of a live turn
(Node Creation + Graph Editing + Relationship Management, in the order retrieval
returned them). Tool surface: inherited from full-tool-surface.toml, itself
built from `model_facing_tool_definitions()` via
`cargo run -p nodespace-agent --bin dump_tool_defs`.

The resident head, EXISTING SCHEMAS, user messages, tool_results, and expect are
unchanged from the base.

HOW TO READ IT

Expected on both turns, matching every prior arm: turn 1 search_nodes with
node_type ticket and the exact enum member "in_dev"; turn 2 update_node with the
uuid from turn 1's tool result plus field_values={"status":
"ready_for_review"}.

A PASS means the prompt work holds at real production fidelity, and the corpus's
argument-formation findings carry over even though its selection findings were
untested.

A FAIL is the more valuable result: it locates the failure in the condition the
corpus never reproduced, and tells us the case set has to be rebuilt at fidelity
before its conclusions are relied on.

A difference inside one rep is noise -- identical code has scored 6/7/7 on the
agent matrix.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the ticket. Exists so turn 2's id is a real tool result.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-ticket"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Creation
Purpose: Create new nodes, records, entries, or instances of any type — tasks, text notes, or custom types like Spec, ADR, Ticket. Use when user wants to add, create, or insert a new item, record, entry, or example of an existing type.

# Node Creation Guidance

CALL create_node NOW: your next action is the tool call, not planning text.

THE TYPE: set node_type to the id shown in EXISTING SCHEMAS, copied exactly.

THE VALUES: put every particular the user supplied into field_values. Work through their message value by value and check each against the type's field list before calling. field_values is the ONLY way any value is stored — a value left out is lost silently while the record still reports as saved.

VALUES WITH NO MATCHING FIELD: If the user supplies a particular the listed fields do not cover, still put it in field_values under a key of your own — lowercase, singular, snake_case, named after the user's own noun for it. NEVER drop a value because the type has no field for it: a dropped value is gone silently and the user was told the record was saved. Bare on a type from EXISTING SCHEMAS; `custom:`-prefixed on a built-in type — text, task, date — where unprefixed names are reserved for built-in fields. Do NOT call create_schema or update_schema to add the field first; put the value in this create_node call.

SUCCESS: After create_node returns a node ID, confirm to the user what was created and STOP. Do NOT call get_node or any other tool — the create response is sufficient. The task is complete.

--- Candidate 2: Graph Editing
Purpose: Modify existing nodes in the knowledge graph - update content, properties, titles, and metadata. For tasks, use update_task_status to change status.

# Graph Editing Guidance

When updating an existing node:

CALL update_node NOW: your next action is the tool call, not planning text.

FIND THEN UPDATE: If you don't have the node's ID, call search_semantic or search_nodes first to locate it. Then act on the resolved ID — do not guess IDs. Then call update_node with the ID and only the fields that need changing.

ALREADY IN THIS CONVERSATION: an indirect reference like "the auth one", "that one", or "the 2400 one" can still name a record already returned by a prior tool result in this conversation — match the description against those records and use that record's id, matching on what the description says, not on which record was discussed last. Never ask the user to supply an id that's already in the conversation.

INDIRECT AND NOT YET FOUND: If the request identifies the target indirectly and no matching record has appeared in this conversation yet — a bare value without naming its field (an amount, a code), a relative date or status word (a weekday, "overdue", "recent"), or a paraphrased description — call resolve_query(request=<the request verbatim>, node_type) FIRST instead of hand-writing a search_nodes query yourself. resolve_query performs the search itself: if it returns resolved:true, act on the returned id directly (e.g. pass it straight to update_node) — do not call search_nodes afterward. If it returns resolved:false with reason:"no_match", tell the user nothing matched. If it returns reason:"multiple_matches", call route_clarify with one specific question naming the candidates as options — do not ask which one in prose.

AN ID ALONE CHANGES NOTHING: a call carrying only an id is a no-op that reports success — every call must also carry the change itself in `field_values`, using a field the type defines, copied character for character. When a field lists allowed values, use one of those values exactly — never a paraphrase of the user's wording, never a capitalised or spaced form of the value.

AMBIGUITY: If search returns 0 results or multiple results that don't clearly match what the user described, call route_clarify with one specific question and concrete options rather than retrying or answering in prose.

TASK STATUS: To change a task's status (open, in_progress, done, cancelled), call update_task_status with the task ID and the new status string. Do NOT use update_node for task status changes.

CONTENT vs FIELD VALUES: Use the content field only when the user is renaming the node. Use field_values for typed fields (status, assignee, due_date, etc.).

SUCCESS: SUCCESS: After the mutating call returns, confirm the change to the user. Do NOT re-fetch or re-search to confirm — the response itself is the confirmation.

--- Candidate 3: Relationship Management
Purpose: Create connections between nodes, explore relationships, and traverse the knowledge graph.

# Relationship Management Guidance

When linking nodes or exploring connections:

CALL create_relationship NOW: your next action is the tool call, not planning text.

CREATING A RELATIONSHIP: both ids come from a prior tool result — copy each exactly, do not ask the user for either. Use a relation_type label defined on the relevant schema (e.g. "supersedes", "has_task") if one applies, otherwise a generic label (member_of, mentions, related_to, etc.).

DIRECTION: from_id is the record that ACTS, to_id is the record acted upon. "A supersedes B" is from_id=A, to_id=B. Reversing them records the opposite fact and still reports success.

TRAVERSING RELATIONSHIPS: Call get_related_nodes with a node ID to fetch its connected nodes. Use the direction parameter ("out", "in", or "both") to control traversal direction. Filter by relation_type to narrow results.

FIND BEFORE LINK: If the user says "link X to Y" and you don't have both IDs, call search_semantic or search_nodes once per entity to resolve them, then call create_relationship.

SUCCESS: SUCCESS: After the mutating call returns, confirm the change to the user. Do NOT re-fetch or re-search to confirm — the response itself is the confirmation.
"""
user = "Which tickets are still in dev?"
expect = """
search_nodes(node_type="ticket", ...) filtering status to the exact enum \
member "in_dev" — not "in dev", not "In Dev". A title-text query instead of a \
status filter is the miss worth noting.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "7f3a1c92-4b6e-4d18-9a05-2e7c8b4f1d63", "title": "Token refresh returns 401 after idle", "node_type": "ticket", "properties": {"status": "in_dev", "assignee": "dana", "sprint": "S-24"}}], "count": 1}
  """

  [[turn.tool]]
