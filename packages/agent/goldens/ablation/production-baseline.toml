  parameters_schema = { properties = { filters = { description = "Optional typed-property filters. Use for status/due_date/amount and any custom schema field, with operators. Omit for plain title/type listing.", items = { properties = { case_sensitive = { description = "For 'contains' operator: case sensitivity (default: true)", type = "boolean" }, node_id = { description = "For 'relationship' filters: the anchor node ID to traverse from", type = "string" }, operator = { description = "Comparison operator", enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"], type = "string" }, property = { description = "Property key. Example: {\"type\": \"property\", \"property\": \"status\", \"operator\": \"equals\", \"value\": \"open\"} — status is a property filter, not metadata.", type = "string" }, relationship_type = { description = "For 'relationship' filters: which graph edge direction to traverse", enum = ["parent", "children", "mentions", "mentioned_by"], type = "string" }, type = { description = "Filter category: 'property' for ANY schema/node field (status, due_date, priority, and all custom schema fields) — use this for status. 'content' for node text. 'metadata' ONLY for the 4 built-in fields created_at, modified_at, node_type, content — NEVER use 'metadata' for status or any schema field, it will fail with 'Invalid metadata field'. 'relationship' for graph edges.", enum = ["property", "content", "metadata", "relationship"], type = "string" }, value = { description = "Value to compare against. Use string for dates (YYYY-MM-DD), string/number for others. Use array for 'in' operator.", type = ["string", "number", "boolean", "array"] } }, required = ["type", "operator"], type = "object" }, type = "array" }, limit = { description = "Max results to return (default 50)", type = "integer" }, node_type = { description = "Filter by node type (e.g. 'task', 'text', or a custom schema ID). For a custom schema ID, copy the id exactly from the EXISTING SCHEMAS block — character for character, including underscores — never shorten, singularize, paraphrase, or guess it from the user's wording. Omit to search all types.", type = "string" }, query = { description = "Keyword or phrase to match against node titles (substring match). Pass empty string or '*' to skip the title filter and enumerate all matching nodes (e.g. to list all nodes of a type).", type = "string" }, sorting = { description = "Optional sort configuration, applied in order.", items = { properties = { direction = { description = "Sort direction (default: asc)", enum = ["asc", "desc"], type = "string" }, field = { description = "Field to sort by (e.g. 'due_date', 'created_at', 'status')", type = "string" } }, required = ["field"], type = "object" }, type = "array" } }, required = [], type = "object" }

  [[turn.tool]]
  name = "search_semantic"
  description = "Find nodes semantically related to a natural-language query. By default returns full content for the top result (include_markdown=1). Increase include_markdown to get full content for more results, or set to 0 for IDs and snippets only. If a result's 'markdown' field is non-empty, that is the complete document — summarize or answer from it directly, do not call get_node or search_nodes again for that result."
  parameters_schema = { properties = { collection = { description = "Filter results to a specific collection path (e.g. 'Architecture', 'Development'). Use for namespace/folder filtering.", type = "string" }, exclude_collections = { description = "Collection paths to exclude from results (e.g. [\"Archived\", \"Drafts\"]). Useful to narrow results when a collection is noisy.", items = { type = "string" }, type = "array" }, graph_boost = { description = "When true, re-rank results by blending similarity with graph connectivity (nodes with more relationships score higher). Formula: 0.7 * similarity + 0.3 * normalized_degree. Default: false.", type = "boolean" }, include_archived = { description = "Whether to include archived nodes in results. Default: false. Set to true when the user explicitly asks about archived or historical content.", type = "boolean" }, include_edges = { description = "When true, attach outgoing 'mentions' relationships of each result as an 'edges' array. Reduces round-trips for graph traversal. Default: false.", type = "boolean" }, include_markdown = { description = "Number of top results to include full markdown content for (0-5, default 1). Set to 0 for IDs and snippets only, or increase to get full content for multiple results.", type = "integer" }, limit = { description = "Max results to return (default 5)", type = "integer" }, node_types = { description = "Filter results to specific node types (e.g. [\"task\", \"text\"]). Use for type filtering; use 'collection' for namespace/folder filtering.", items = { type = "string" }, type = "array" }, property_filters = { additionalProperties = { type = "string" }, description = "Filter by node properties (AND logic, e.g. {\"status\": \"done\"})", type = "object" }, query = { description = "Natural language query for semantic search", type = "string" }, scope = { description = "Search scope: 'knowledge' (default, searches text/header/code/schema nodes) or 'everything' (all embedded node types). Note: ai-chat conversations are not embedded, so they are never returned by search regardless of scope.", enum = ["knowledge", "everything"], type = "string" }, threshold = { description = "Minimum similarity score (0.0-1.0). Lower values return more results with less precision. Default: 0.3. Lower to 0.1-0.2 for broader recall when initial results are too few.", type = "number" } }, required = ["query"], type = "object" }

  [[turn.tool]]
  name = "get_node"
  description = "Get a node by ID. In the default json format, returns the node's current values in 'properties', plus 'available_properties' — every field this node's type defines, each with its type, any allowed values, and 'set' indicating whether this node currently has a value for it. A field with \"set\": false exists and can be written; it simply has no value yet. Use format=markdown instead to get the node and all its descendants as a readable document; that format returns the document text alone, without either of those fields."
  parameters_schema = { properties = { format = { description = "Output format: json (default) returns node fields, markdown returns the node and all descendants as a readable document", enum = ["json", "markdown"], type = "string" }, id = { description = "Node ID to retrieve", type = "string" } }, required = ["id"], type = "object" }

  [[turn.tool]]
  name = "create_node"
  description = "Create one new record of a type that already exists. Use for a single instance, never to define a new kind of record. Always pass 'content' as the record's title and nothing else — facts about it belong in 'field_values', never appended to the title. Always pass 'field_values' with every particular the user supplied, checked against the type's own field list — it is the only way those values are stored, and a call without them creates an empty record that still reports as saved. If the schema has a title_template (shown in EXISTING SCHEMAS), include those template fields in 'field_values' — the service composes the displayed title from them automatically. The example's user said: \"open a ticket for dana to rotate the signing keys on deploy in S-24, it's in dev, and it depends on the vault migration\". Note depends_on: the type lists no field for it, so it is carried under a key named after the user's own wording rather than dropped. Example call: {\"node_type\": \"ticket\", \"content\": \"Rotate signing keys on deploy\", \"field_values\": {\"status\": \"in_dev\", \"assignee\": \"dana\", \"sprint\": \"S-24\", \"depends_on\": \"the vault migration\"}}"
