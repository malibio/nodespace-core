# derived-from: dev-empty-result-query.toml -- subtree minimised per the KEEP/DROP rule.
name = "dev-empty-result-query-minimal"
reps = 5

notes = """
MINIMAL-SUBTREE SWEEP -- dev-empty-result-query

The editorial rule applied here, chosen by what a schema CAN and CANNOT state:

  KEEP  a sentence stating something no parameter schema and no EXISTING SCHEMAS
        block can express -- an ontological distinction (kind vs instance,
        reference-as-field) or an instruction to act on something ABSENT from
        the declared surface (a value with no matching field).
  DROP  a sentence a schema already carries -- argument shape, required-ness,
        enum membership, key spelling, "call X now", or a restatement of the
        tool description.

Nothing survives the KEEP test for this case: every rule its subtree states is already carried by a parameter schema or by EXISTING SCHEMAS, so the subtree is dropped entirely.

EVIDENCE THIS RULE RESTS ON (dev-schema-creation, 3 reps each, byte-identical):

  whole subtree, 786 chars              supersedes PRESENT
  ONE TYPE rule alone, 2 sentences      PRESENT
  ONE TYPE rule alone, 1 terse clause   PRESENT
  ENUM rule alone, 2 sentences          PRESENT
  FIELDS rule alone                     ABSENT
  FIELDS expanded to 2 sentences        ABSENT
  an irrelevant 2-sentence rule         MALFORMED OUTPUT
  no subtree at all                     ABSENT

Terse-but-on-topic works; long-but-off-topic does not, and off-topic prose in the
slot is worse than an empty slot. Confirmed at production fidelity (9 tools, 3
candidates) by ablation/minimal-at-fidelity.toml, 5/5.

BASE RESULT: prose reply, no tool call
"""

# ---------------------------------------------------------------------------
# Turn 1 — the query. Returns nothing, legitimately.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-query-empty-sprint"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Search
Purpose: Find, list, or filter existing records by title, type, or stored \
field value.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "Anything assigned in sprint S-25 yet?"
expect = """
search_nodes(node_type="ticket") filtering sprint to "S-25". The exact filter \
shape matters less here than turn 2 — this turn exists to produce a real \
empty tool result for turn 2 to report on.
"""

  [turn.tool_results]
  search_nodes = '{"results": [], "count": 0}'

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. A count of 0 means nothing in the workspace \
  matches — it does not mean the query was wrong.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id. Use the unquoted id at the start of the EXISTING SCHEMAS line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      [turn.tool.parameters_schema.properties.filters]
      type = "array"
      description = "Field filters. Use the field name and value exactly as listed for the type."

        [turn.tool.parameters_schema.properties.filters.items]
        type = "object"
        required = ["type", "operator", "property", "value"]

          [turn.tool.parameters_schema.properties.filters.items.properties.type]
          type = "string"
          enum = ["property"]

          [turn.tool.parameters_schema.properties.filters.items.properties.operator]
          type = "string"
          enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"]

          [turn.tool.parameters_schema.properties.filters.items.properties.property]
          type = "string"

          [turn.tool.parameters_schema.properties.filters.items.properties.value]
          type = "string"

# ---------------------------------------------------------------------------
# Turn 2 — report the empty result. Prose is the correct answer here.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-report-nothing-found"
system = """
You are NodeSpace's assistant, acting on a user's workspace.

Answer the user from the tool results already in this conversation. Call a \
tool only when the conversation does not already contain the answer.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. If none \
applies, answer the user normally.

--- Candidate 1: Reporting Results
Purpose: Tell the user what the tool results in this conversation actually \
say.

A COUNT OF 0 IS AN ANSWER: say plainly that nothing matched. It is a fact \
about the workspace, not a failed lookup.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "So what did you find?"
expect = """
A prose reply saying nothing is in sprint S-25 yet. This is the case in the \
corpus whose correct outcome is NOT a tool call — the fact is already in the \
conversation. Two failures worth telling apart: a re-run search with a \
loosened filter (returns real records that answer a different question), and \
any invented ticket.
"""

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. A count of 0 means nothing in the workspace \
  matches — it does not mean the query was wrong.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id, copied exactly from EXISTING SCHEMAS."
