# derived-from: production-baseline.toml -- the honest 9-tool/3-candidate reference.
name = "fidelity-k1"
reps = 5

notes = """
ARM E -- RETRIEVAL_TOP_K = 1: one candidate, and the tool surface scoped to that
one skill's whitelist.

The largest single footprint lever. Production unions three candidates'
whitelists, and because the read tools appear in 5-6 of the 8 seeded skills, that
union is 9 of 15 registered tools. K=1 gives Node Creation's whitelist alone:
create_node, search_semantic, search_nodes, get_node.

Note this arm removes BOTH the extra candidates and the extra tools, so a failure
does not say which mattered -- fidelity-no-subtrees already isolates the
candidate half. What this measures is whether the turn survives on a 4-tool
surface at all.

Reference results, all 5 reps, byte-identical within each arm:
  production-baseline   turn1 RIGHT  turn2 RIGHT   9 tools, 3 full subtrees
  fidelity-no-subtrees  turn1 RIGHT  turn2 RIGHT   9 tools, 0 subtrees
  fidelity-rank1-only   turn1 WRONG  turn2 RIGHT   9 tools, 1 subtree
  fidelity-rank1-fetch  turn1 RIGHT  turn2 RIGHT   10 tools, 1 subtree, 0 fetches

turn 1 RIGHT = search_nodes with node_type "ticket" and filters carrying the
exact enum member "in_dev". The 5/5 failure shape is query "in dev" with no
filter -- right tool, wrong argument shape.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the ticket. Exists so turn 2's id is a real tool result.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-ticket"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Creation
Purpose: Create new nodes, records, entries, or instances of any type — tasks, text notes, or custom types like Spec, ADR, Ticket. Use when user wants to add, create, or insert a new item, record, entry, or example of an existing type.
# Node Creation Guidance

CALL create_node NOW: your next action is the tool call, not planning text.

THE TYPE: set node_type to the id shown in EXISTING SCHEMAS, copied exactly.

THE VALUES: put every particular the user supplied into field_values. Work through their message value by value and check each against the type's field list before calling. field_values is the ONLY way any value is stored — a value left out is lost silently while the record still reports as saved.

VALUES WITH NO MATCHING FIELD: If the user supplies a particular the listed fields do not cover, still put it in field_values under a key of your own — lowercase, singular, snake_case, named after the user's own noun for it. NEVER drop a value because the type has no field for it: a dropped value is gone silently and the user was told the record was saved. Bare on a type from EXISTING SCHEMAS; `custom:`-prefixed on a built-in type — text, task, date — where unprefixed names are reserved for built-in fields. Do NOT call create_schema or update_schema to add the field first; put the value in this create_node call.

SUCCESS: After create_node returns a node ID, confirm to the user what was created and STOP. Do NOT call get_node or any other tool — the create response is sufficient. The task is complete.
"""
user = "Which tickets are still in dev?"
expect = """
search_nodes(node_type="ticket", ...) filtering status to the exact enum \
member "in_dev" — not "in dev", not "In Dev". A title-text query instead of a \
status filter is the miss worth noting.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "7f3a1c92-4b6e-4d18-9a05-2e7c8b4f1d63", "title": "Token refresh returns 401 after idle", "node_type": "ticket", "properties": {"status": "in_dev", "assignee": "dana", "sprint": "S-24"}}], "count": 1}
  """

  [[turn.tool]]
  name = "create_node"
  description = "Create one new record of a type that already exists. Use for a single instance, never to define a new kind of record. Always pass 'content' as the record's title and nothing else — facts about it belong in 'field_values', never appended to the title. Always pass 'field_values' with every particular the user supplied, checked against the type's own field list — it is the only way those values are stored, and a call without them creates an empty record that still reports as saved. If the schema has a title_template (shown in EXISTING SCHEMAS), include those template fields in 'field_values' — the service composes the displayed title from them automatically. The example's user said: \"open a ticket for dana to rotate the signing keys on deploy in S-24, it's in dev, and it depends on the vault migration\". Note depends_on: the type lists no field for it, so it is carried under a key named after the user's own wording rather than dropped. Example call: {\"node_type\": \"ticket\", \"content\": \"Rotate signing keys on deploy\", \"field_values\": {\"status\": \"in_dev\", \"assignee\": \"dana\", \"sprint\": \"S-24\", \"depends_on\": \"the vault migration\"}}"
