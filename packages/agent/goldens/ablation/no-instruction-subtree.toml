name = "no-instruction-subtree"
# derived-from: dev-status-change-enum.toml — the base this arm subtracts from.
reps = 5

notes = """
ABLATION ARM. Built by subtraction from dev-status-change-enum.toml.

The candidate framing kept — `--- Candidate N:` and its Purpose line — but
the rendered instruction subtree removed.

This is the finer cut of `no-candidate-block`, and the one that separates two
things production always ships together: knowing WHICH capability was matched,
versus being told HOW to carry it out. If this arm ties with the full arm, the
instructions are inert and the routing signal alone is doing the work. If it
ties with `no-candidate-block` instead, the framing is inert and the
instructions are the whole value.

Relevant prior: a continuation rule measured inert at 72/72, and 10,493 chars
of resident prose scored 50% against 445 chars at 73%. Instruction text has
not historically paid for itself.

HOW TO READ IT

Compare against the full arm's measured result: 3/3 on both turns, turn 1
sending node_type "ticket" (the id, not the display name) with a status filter
of the exact enum member "in_dev", and turn 2 sending update_node with the
real uuid from turn 1's tool result plus field_values={"status":
"ready_for_review"}.

A tie means this block is not paying for the context it consumes ON THIS CASE.
It does not license deleting the block: one case is not the workload, and a
block can be inert here and load-bearing on a case this corpus does not hold.

A difference inside one rep of the full arm is noise. Identical code has
scored 6/7/7 on the agent matrix; single runs are not decision-grade.

PROVISIONAL ON #2123

Inherits the full arm's dependency: the write parameter is `field_values`, not
`properties`, because a parameter named `properties` is silently deleted by
the Gemma-4 template. That makes this arm — like its parent — NOT
production-shaped today, and provisional on #2123 being fixed by renaming. If
it is fixed another way, this file needs rewriting rather than annotating.

MEASURED: 3/3, IDENTICAL TO THE FULL ARM.

The finer cut, and it resolves which half of the candidate block was inert.
Keeping `--- Candidate N:` and its Purpose line while dropping the rendered
instruction subtree changed nothing — and `no-candidate-block`, which drops
the framing too, ALSO changed nothing.

So neither half is doing work here. The instructions are inert, and the
routing framing around them is inert. Together the two arms bound it: the
whole mechanism bought nothing measurable on this case.

Size, measured on the POST-TEMPLATE prompt via NODESPACE_PROMPT_DUMP (see
no-candidate-block.toml for why that is the figure quoted):

  turn 1   2681 -> 2371
  turn 2   4401 -> 3828

ISOLATION CORRECTED AFTER REVIEW

The first version of this arm was NOT a single-block subtraction: the
generator's heuristic for finding the end of the Purpose sentence consumed
"already exists." along with the instruction body, and the surviving line
continuation then spliced the EXISTING SCHEMAS header into mid-sentence
on turn 2. Two variables moved, not one, and the damaged half was the block
the sibling arm proves load-bearing.

Caught in review. Fixed and RE-RUN rather than re-annotated — a corrected note
over an uncorrected measurement would be worse than the original error.
Isolation is now verified line-by-line against the base rather than by marker
presence: nothing added on either turn, and every removed line is an
instruction-subtree line.

The result survived the correction: still 3/3 identical to the full arm.

Consistent with the project's prior measurements of instruction text: a
continuation rule inert at 72/72, and 10,493 characters of resident prose
scoring 50% against 445 characters at 73%.

Per-arm results also recorded on #2122.
"""

# ---------------------------------------------------------------------------
# Turn 1 — find the ticket. Exists so turn 2's id is a real tool result.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-find-ticket"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Search
Purpose: Find, list, or filter existing records by title, type, or stored \
field value.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "Which tickets are still in dev?"
expect = """
search_nodes(node_type="ticket", ...) filtering status to the exact enum \
member "in_dev" — not "in dev", not "In Dev". A title-text query instead of a \
status filter is the miss worth noting.
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "7f3a1c92-4b6e-4d18-9a05-2e7c8b4f1d63", "title": "Token refresh returns 401 after idle", "node_type": "ticket", "properties": {"status": "in_dev", "assignee": "dana", "sprint": "S-24"}}], "count": 1}
  """

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. Use when the node you need is not already \
  identified in this conversation.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      # The type id is the unquoted token, not the quoted display name beside
      # it. Naming both halves of the line is what makes the distinction
      # actionable — "copied exactly" alone left the model sending "Ticket".
      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id. Use the unquoted id at the start of the EXISTING SCHEMAS line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      [turn.tool.parameters_schema.properties.filters]
      type = "array"
      description = "Field filters. Use the field name and value exactly as listed for the type."

        [turn.tool.parameters_schema.properties.filters.items]
        type = "object"
        required = ["type", "operator", "property", "value"]

          [turn.tool.parameters_schema.properties.filters.items.properties.type]
          type = "string"
          enum = ["property"]

          [turn.tool.parameters_schema.properties.filters.items.properties.operator]
          type = "string"
          enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"]

          [turn.tool.parameters_schema.properties.filters.items.properties.property]
          type = "string"

          [turn.tool.parameters_schema.properties.filters.items.properties.value]
          type = "string"

# ---------------------------------------------------------------------------
# Turn 2 — the write. The case's real subject.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-status-to-ready-for-review"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
- adr "ADR" -> title: text, required; status: enum {proposed,accepted,superseded}, required; supersedes: text

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Update
Purpose: Change a field on an existing record — status, assignee, dates, or \
any stored value — when the user describes a new state for something that \
already exists.

EXISTING SCHEMAS (do not recreate these; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "I've pushed the branch for that one — it's ready for review now"
expect = """
update_node carrying BOTH the id from turn 1's real tool result \
("7f3a1c92-4b6e-4d18-9a05-2e7c8b4f1d63", not the ticket's title) AND \
field_values={"status": "ready_for_review"} — the exact enum member, not \
"review" / "In Review" / "ready for review". Two distinct failures worth \
telling apart: a title in `id` means the id never reached the model, and an \
absent or empty `field_values` means the write silently changes nothing.
"""

  [turn.tool_results]
  update_node = '{"ok": true, "updated": ["status"]}'

  [[turn.tool]]
  name = "update_node"
  description = """
  Update an existing node's fields immediately — call this directly with the \
  node id you already have from a previous tool result. Do not ask the user \
  to confirm or supply the id. An id on its own changes nothing: every call \
  must also carry the change itself in field_values.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]

      [turn.tool.parameters_schema.properties.id]
      type = "string"
      description = "Node id to update — the \"id\" value exactly as it appeared in a tool result. Never the node's title."

      [turn.tool.parameters_schema.properties.content]
      type = "string"
      description = "New title text. Only when the user is renaming the node."

      # Single-line, deliberately: `normalize_case_text` applies to the case's
      # own prompt fields, not to strings nested inside a tool's JSON Schema —
      # a `"""` block here reaches the model with its TOML indent and a
      # trailing newline embedded in the description. Verified with --check.
      # Declared sub-properties mirroring the `ticket` type's own fields — the
      # pattern dev-instance-creation.toml established after eight
      # wording-level arms failed to carry a value the schema did not declare.
      # Applied here for consistency and to check it does not regress a case
      # that already passed.
      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "The change itself: field keys to new values, e.g. {\"status\": \"done\"}. Required whenever the request changes the node's state rather than its title. Use a field the type defines, copied exactly. When a field lists allowed values, use one of those values exactly. Send only the keys that change."

        [turn.tool.parameters_schema.properties.field_values.properties.status]
        type = "string"
        enum = ["ready_for_dev", "in_dev", "ready_for_review", "in_review", "done"]
        description = "The ticket's workflow state."

        [turn.tool.parameters_schema.properties.field_values.properties.assignee]
        type = "string"
        description = "Who the work is assigned to."

        [turn.tool.parameters_schema.properties.field_values.properties.sprint]
        type = "string"
        description = "The sprint identifier."

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields. Use when the node you need is not already \
  identified in this conversation.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id, copied exactly from EXISTING SCHEMAS."
