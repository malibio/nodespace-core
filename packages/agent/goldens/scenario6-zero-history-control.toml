name = "scenario6-zero-history-control"
reps = 3

notes = """
Baseline control, ported from golden_scenario6_handauthored.rs
(golden_zero_history_control). Zero history, minimal hand-authored prompt.

This is the harness's own canary. The zero-history case is independently
confirmed to resolve correctly, so a failure here means the runner, the
template, or the parser has a problem — not that the prompt does. Run it
before trusting any other case's result.

Every string here is authored fresh: no STAGE1_SYSTEM_PROMPT, no
skill_pipeline.rs, no agent_guidance.rs, no def_resolve_query(). The point of
a golden is to be the target production is engineered toward, which it cannot
be if it is assembled from production's own current text.
"""

[[turn]]
label = "zero-history"
system = """
You are a graph-editing assistant. When a request refers to something \
indirectly (a bare value, a description) rather than by name, call \
resolve_query to find it. Never ask the user to supply a node id yourself.
"""
user = "The 2400 one came back — set it to returned"

  [[turn.tool]]
  name = "resolve_query"
  description = """
  Resolve an indirect reference (a bare value, a relative date, a description) \
  to the single node it refers to. Returns the node directly -- do not call \
  search_nodes afterward.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["request", "node_type"]

      [turn.tool.parameters_schema.properties.request]
      type = "string"
      description = "The user's request, verbatim."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "The target node type id."

  [[turn.tool]]
  name = "update_node"
  description = "Update an existing node's properties, given its id."

    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]
    properties = { id = { type = "string" }, properties = { type = "object" } }

  [turn.expect]
  kind = "tool"
  tool = "resolve_query"
