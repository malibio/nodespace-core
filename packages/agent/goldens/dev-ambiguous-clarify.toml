name = "dev-ambiguous-clarify"
reps = 3

notes = """
PRODUCTION-SHAPED. Dev-workflow domain.

Scenario: a genuinely ambiguous request, where the correct answer is to ASK.
Two tickets are in review and the user says "merge it". Nothing in the
conversation distinguishes them, so no correct resolution exists — acting is
the failure and clarifying is the right answer.

Asking is a first-class outcome, not a fallback. ADR-038's clarification
contract is that there is at most one clarification per intent and that it
must surface concrete candidates rather than a bare "what do you mean?" —
which is why route_clarify takes options rather than only a question.

NOTE ON THIS ISSUE'S ACCEPTANCE CRITERION

#2122 asks for a case "whose correct outcome is route_clarify". Read as
prose, per the correction recorded on the issue: the merged utility has no
typed expectation kinds and never evaluates `expect`. The right outcome here
is the model calling route_clarify with both tickets as options; a human reads
the output and judges. There is nothing asserting it.

THE FAILURE THIS CASE EXISTS TO CATCH

Two distinct wrong answers, worth telling apart in the output:

- picking one of the two tickets and calling update_node on it — a silent
  wrong write, the worst outcome available here
- asking in PROSE instead of calling route_clarify. Measured during #2118: on
  the arm where the model refused to act, it asked for a node id in prose
  rather than calling a clarification tool. Prose looks reasonable in a
  transcript and is invisible to anything downstream that expects a tool call.

An ambiguity the conversation CAN resolve is not this case. The two tickets
differ only in identity here — same status, same sprint — so nothing short of
asking can pick one.

PROVISIONAL ON #2123 — THIS CASE IS NOT PRODUCTION-SHAPED TODAY

The update_node on this case's tool surface uses `field_values`, not
`properties`, because a parameter named `properties` is silently deleted by
the Gemma-4 template. See dev-status-change-enum.toml's notes for the
measurement.

Production says `properties`; this case says `field_values`. So it does not
reproduce production's tool surface and must not be read as validated
production shape. Provisional on #2123 being fixed BY RENAMING, in which case
it becomes correct as written. Fixed any other way, it needs rewriting and
re-measuring rather than re-annotating.

The dependency matters here even though the expected answer is route_clarify,
not a write: update_node is on the surface precisely to make the wrong answer
available, so its shape is part of what the case measures.

CONTAMINATION GUARD (#1932)

Dev-workflow vocabulary. Deliberately distinct from the dropped
`ambiguous-reference-clarify` probe recovered from 625263a0, which used a
rehearsal room and chairs.

MEASURED — per-case results recorded on #2122.
"""

# ---------------------------------------------------------------------------
# Turn 1 — establish two indistinguishable candidates via a real tool result.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn1-list-in-review"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Search
Purpose: Find, list, or filter existing records by title, type, or stored \
field value.

CALL search_nodes NOW: your next action is the tool call, not planning text.

FILTERING BY FIELD: to narrow by a stored value, pass filters. Copy the type \
id and the field name exactly as they appear in RELEVANT ENTITY TYPES.
"""
user = "What's sitting in review?"
expect = """
search_nodes(node_type="ticket", ...) filtering status to the exact enum \
member "in_review".
"""

  [turn.tool_results]
  search_nodes = """
  {"results": [{"id": "c41d8e07-9b32-4a6f-8d15-3f92a7b6c084", "title": "Rotate signing keys on deploy", "node_type": "ticket", "properties": {"status": "in_review", "assignee": "dana", "sprint": "S-24"}}, {"id": "e58b2f19-6c74-4e83-b207-1a4d9c5e3f60", "title": "Backfill audit log retention", "node_type": "ticket", "properties": {"status": "in_review", "assignee": "dana", "sprint": "S-24"}}], "count": 2}
  """

  [[turn.tool]]
  name = "search_nodes"
  description = """
  Find, list, and filter nodes by title, type, or stored field value. Returns \
  each node's id and fields.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["query"]

      [turn.tool.parameters_schema.properties.query]
      type = "string"
      description = "Free-text title match. Empty string lists every node of node_type."

      [turn.tool.parameters_schema.properties.node_type]
      type = "string"
      description = "Restrict to one type id. Use the unquoted id at the start of the RELEVANT ENTITY TYPES line (e.g. `ticket`), never the quoted display name that follows it (e.g. \"Ticket\")."

      [turn.tool.parameters_schema.properties.filters]
      type = "array"
      description = "Field filters. Use the field name and value exactly as listed for the type."

        [turn.tool.parameters_schema.properties.filters.items]
        type = "object"
        required = ["type", "operator", "property", "value"]

          [turn.tool.parameters_schema.properties.filters.items.properties.type]
          type = "string"
          enum = ["property"]

          [turn.tool.parameters_schema.properties.filters.items.properties.operator]
          type = "string"
          enum = ["equals", "contains", "gt", "lt", "gte", "lte", "in", "exists"]

          [turn.tool.parameters_schema.properties.filters.items.properties.property]
          type = "string"

          [turn.tool.parameters_schema.properties.filters.items.properties.value]
          type = "string"

# ---------------------------------------------------------------------------
# Turn 2 — the ambiguous request. Asking is correct.
# ---------------------------------------------------------------------------
[[turn]]
label = "turn2-merge-it-ambiguous"
system = """
You are NodeSpace's assistant, acting on a user's workspace.
Call exactly one tool. Do not answer the user in prose when a tool applies.

COLLECTIONS: Engineering, Q3 Planning

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]

REFERENCE — procedures relevant to this request. Use whichever applies and \
IGNORE the rest. Do not describe, quote, or summarise any of it. Your reply \
must be the tool call itself. If none applies, answer the user normally.

--- Candidate 1: Node Update
Purpose: Change a field on an existing record when the user describes a new \
state for something that already exists.

CALL update_node NOW: your next action is the tool call, not planning text.

THE ID: use the id from the tool result above, copied exactly.

THE CHANGE: express the new state in `field_values`, using one of the field's \
allowed values exactly.

--- Candidate 2: Clarification
Purpose: Ask the user which record they meant, when the request fits more \
than one and nothing in the conversation picks between them.

WHEN THE REQUEST FITS MORE THAN ONE RECORD: call route_clarify, listing the \
candidates as options. Do NOT pick one — a wrong write reports success and \
the user is not told which record changed.

ASK BY CALLING THE TOOL: a question written as ordinary prose is not a \
clarification. route_clarify is the only way the question reaches the user as \
one.

ONE CLARIFICATION PER REQUEST: ask once, with concrete options, not a bare \
"what do you mean?".

RELEVANT ENTITY TYPES (existing types — do not recreate; do not copy their \
fields onto a new type):
- ticket "Ticket" -> title: text, required; status: enum {ready_for_dev,in_dev,ready_for_review,in_review,done}, required; assignee: text; sprint: text [title_template: {title}]
"""
user = "Go ahead and mark it done"
expect = """
route_clarify listing BOTH in-review tickets as options — asking is the \
correct answer here, not a fallback. Two failures worth telling apart: \
update_node against either ticket is a silent wrong write, and a prose \
question instead of a route_clarify call looks fine in a transcript while \
being invisible to anything downstream.
"""

  [turn.tool_results]
  route_clarify = '{"ok": true, "asked": true}'

  [[turn.tool]]
  name = "route_clarify"
  description = """
  Ask the user which of several specific records they meant. Use only when \
  the request matches more than one and nothing in the conversation \
  distinguishes them. Always supply the candidates as options — never a bare \
  question.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["question", "options"]

      [turn.tool.parameters_schema.properties.question]
      type = "string"
      description = "The question to put to the user, one sentence."

      [turn.tool.parameters_schema.properties.options]
      type = "array"
      description = "The concrete candidates the request could mean, one entry each."

        [turn.tool.parameters_schema.properties.options.items]
        type = "object"
        required = ["id", "label"]

          [turn.tool.parameters_schema.properties.options.items.properties.id]
          type = "string"
          description = "The candidate's id, copied exactly from the tool result."

          [turn.tool.parameters_schema.properties.options.items.properties.label]
          type = "string"
          description = "How to describe this candidate to the user."

  [[turn.tool]]
  name = "update_node"
  description = """
  Update an existing node's fields immediately — call this directly with the \
  node id you already have from a previous tool result. An id on its own \
  changes nothing: every call must also carry the change itself in \
  field_values.
  """

    [turn.tool.parameters_schema]
    type = "object"
    required = ["id"]

      [turn.tool.parameters_schema.properties.id]
      type = "string"
      description = "Node id to update — the \"id\" value exactly as it appeared in a tool result. Never the node's title."

      # Declared sub-properties mirroring the `ticket` type's own fields — the
      # pattern dev-instance-creation.toml established after eight
      # wording-level arms failed to carry a value the schema did not declare.
      # Applied here for consistency and to check it does not regress a case
      # that already passed.
      [turn.tool.parameters_schema.properties.field_values]
      type = "object"
      description = "The change itself: field keys to new values, e.g. {\"status\": \"done\"}. When a field lists allowed values, use one of those values exactly."

        [turn.tool.parameters_schema.properties.field_values.properties.status]
        type = "string"
        enum = ["ready_for_dev", "in_dev", "ready_for_review", "in_review", "done"]
        description = "The ticket's workflow state."

        [turn.tool.parameters_schema.properties.field_values.properties.assignee]
        type = "string"
        description = "Who the work is assigned to."

        [turn.tool.parameters_schema.properties.field_values.properties.sprint]
        type = "string"
        description = "The sprint identifier."
