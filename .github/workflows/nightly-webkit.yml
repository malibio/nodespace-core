name: Nightly WebKit smoke

# Non-blocking, nightly smoke coverage of the shipping WebKit engine.
#
# The desktop app renders in WKWebView (WebKit / JavaScriptCore), but the
# browser-mode test tier (`test:browser`) runs in Chromium (Blink). Anything
# WebKit-specific can pass in Chromium yet break in the real app. This job runs
# the SAME engine-agnostic browser suite (src/tests/browser/**) against
# Playwright's bundled WebKit build — the shipping engine's family — so a
# WebKit-only regression surfaces here.
#
# This workflow is deliberately NOT a required status check and is NOT wired into
# the blocking `ci.yml` gate: it is a nightly signal, not a merge gate. Chromium
# stays the fast, blocking browser tier (via `test:integration:full` / local
# runs); WebKit is the nightly delta check.

on:
  schedule:
    # 07:00 UTC ≈ midnight PT — nightly.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-webkit-${{ github.ref }}
  cancel-in-progress: true

# `issues: write` is needed by the failure reporter below; the default token is
# read-only for issues on a scheduled run.
permissions:
  contents: read
  issues: write

jobs:
  webkit:
    name: test:webkit (Playwright WebKit)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit types
        run: bun run --cwd packages/desktop-app sync

      - name: Install Playwright WebKit browser
        # The WebKit revision is pinned transitively by the lockfile's Playwright
        # version; log it so a nightly red is easy to triage as an engine-version
        # delta vs. an app regression. (No --with-deps: that installer is
        # Linux-only and a no-op on macos-latest.)
        run: |
          bunx --bun playwright --version
          bunx --bun playwright install webkit
        working-directory: packages/desktop-app

      - name: Run WebKit smoke suite
        # tee'd to a file so the failure step below can quote the actual
        # message. A suite failure and the runner failing to get that far
        # (Playwright install, bun, network) are the same red X otherwise,
        # and whoever triages the filed issue can't tell which happened
        # without opening the raw run log.
        #
        # `shell: bash` is REQUIRED, not decoration. With no `shell:` key Actions
        # runs `run:` as `bash -e {0}` — `-e` only. pipefail is opt-in, applied
        # only when `shell: bash` is set explicitly. Without it tee's exit code
        # wins, a failing suite reports GREEN, `if: failure()` never fires, and
        # this workflow silently stops reporting the thing it exists to report.
        shell: bash
        run: bun run test:webkit 2>&1 | tee webkit-output.txt

      # A nightly that fails silently is a nightly nobody reads: this suite was
      # red for five consecutive nights before anyone noticed. On failure, open
      # a tracking issue and assign the people who triage it, so the red arrives
      # as an assignment notification rather than sitting in the Actions tab.
      #
      # An already-OPEN tracking issue is commented on rather than duplicated, so
      # a long red streak stays one thread instead of one issue per night. A
      # closed one is not reopened — once someone has called an outage resolved,
      # the next failure is new news and deserves its own thread.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Nightly WebKit smoke failed. Run: ${RUN_URL}"
            echo
            echo "Output:"
            echo '```'
            tail -n 100 webkit-output.txt 2>/dev/null | grep . || echo "(no output captured)"
            echo '```'
            echo
            echo "A \"Failed Suites\" line above is a real test failure. Anything else"
            echo "(or no output at all) means the job failed before the suite ran —"
            echo "Playwright install, bun, or network — not necessarily a regression."
          } > issue-body.txt
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --state open --label nightly-failure --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file issue-body.txt
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Nightly WebKit smoke is failing" \
              --label nightly-failure \
              --assignee malibio,mstomar125 \
              --body-file issue-body.txt
          fi
