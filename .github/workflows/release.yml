name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build (or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - macos-arm
          - macos-intel
          - macos-pkg
          - linux-arm
          - linux-x86
          - windows-x86

# Required permissions for uploading release assets and creating failure issues
permissions:
  contents: write
  issues: write

jobs:
  # macOS ARM is a standalone job so publish-npm can depend on it alone,
  # without being blocked by the Intel or Windows legs.
  build-tauri-macos-arm:
    name: Build Tauri (macOS ARM)
    runs-on: macos-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./packages/desktop-app/src-tauri -> target
            . -> target

      - name: Install Protobuf
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install protobuf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit types
        run: bun run --cwd packages/desktop-app sync

      - name: Download embedding model for bundling
        run: |
          mkdir -p packages/desktop-app/src-tauri/resources/models
          gh release download models-v2 --pattern "nomic-embed-text-v1.5.Q8_0.gguf" --dir packages/desktop-app/src-tauri/resources/models/
          echo "Model downloaded:"
          ls -la packages/desktop-app/src-tauri/resources/models/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build nodespaced and nodespace sidecars
        run: |
          TRIPLE="aarch64-apple-darwin"
          BIN_DIR="packages/desktop-app/src-tauri/binaries"
          mkdir -p "${BIN_DIR}"

          echo "Building nodespaced for ${TRIPLE}..."
          cargo build --release --bin nodespaced --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespaced" "${BIN_DIR}/nodespaced-${TRIPLE}"
          chmod +x "${BIN_DIR}/nodespaced-${TRIPLE}"

          echo "Building nodespace CLI for ${TRIPLE}..."
          cargo build --release --bin nodespace --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespace" "${BIN_DIR}/nodespace-${TRIPLE}"
          chmod +x "${BIN_DIR}/nodespace-${TRIPLE}"

          echo "Sidecars built:"
          ls -la "${BIN_DIR}/"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Michael Libio (F4M5J7YNLS)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop-app
          tauriScript: bunx tauri
          args: '--target aarch64-apple-darwin'
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Upload artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-macos-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bundle/
          if-no-files-found: warn
          # Inspection-only (workflow_dispatch): a short window to download a build
          # for manual checking, not a deliverable.
          retention-days: 7

      - name: Upload .app bundle for pkg job
        uses: actions/upload-artifact@v7
        with:
          name: app-bundle-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bundle/macos/
          if-no-files-found: error
          # Job-to-job handoff only — consumed by the pkg job (download-artifact)
          # within minutes of this run. Never a deliverable, so the minimum: 1 day.
          retention-days: 1

  build-tauri:
    name: Build Tauri (other platforms)
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            rust_targets: 'x86_64-apple-darwin'
            id: 'macos-intel'

          # Windows x86_64
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            rust_targets: 'x86_64-pc-windows-msvc'
            id: 'windows-x86'

    runs-on: ${{ matrix.platform }}

    steps:
      # Platform filter: skip early for unselected platforms (workflow_dispatch only)
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || [[ "${{ inputs.platform }}" == "all" ]] || [[ "${{ inputs.platform }}" == "${{ matrix.id }}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.id }} (selected: ${{ inputs.platform }})"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Install Rust stable
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        if: steps.filter.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./packages/desktop-app/src-tauri -> target
            . -> target

      - name: Install Protobuf (macOS)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'macos-latest'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install protobuf

      - name: Setup Bun
        if: steps.filter.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        if: steps.filter.outputs.skip != 'true'
        run: bun install --frozen-lockfile

      - name: Generate SvelteKit types
        if: steps.filter.outputs.skip != 'true'
        run: bun run --cwd packages/desktop-app sync

      # Download nomic-embed-text GGUF model for llama.cpp embeddings
      - name: Download embedding model for bundling (macOS)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'macos-latest'
        run: |
          mkdir -p packages/desktop-app/src-tauri/resources/models
          gh release download models-v2 --pattern "nomic-embed-text-v1.5.Q8_0.gguf" --dir packages/desktop-app/src-tauri/resources/models/
          echo "Model downloaded:"
          ls -la packages/desktop-app/src-tauri/resources/models/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build nodespaced and nodespace CLI sidecars for macOS bundle (Issue #1179).
      # The binaries are placed in the exact path tauri.conf.json externalBin expects.
      - name: Build nodespaced and nodespace sidecars (macOS)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'macos-latest'
        run: |
          TRIPLE="${{ matrix.rust_targets }}"
          BIN_DIR="packages/desktop-app/src-tauri/binaries"
          mkdir -p "${BIN_DIR}"

          echo "Building nodespaced for ${TRIPLE}..."
          cargo build --release --bin nodespaced --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespaced" "${BIN_DIR}/nodespaced-${TRIPLE}"
          chmod +x "${BIN_DIR}/nodespaced-${TRIPLE}"

          echo "Building nodespace CLI for ${TRIPLE}..."
          cargo build --release --bin nodespace --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespace" "${BIN_DIR}/nodespace-${TRIPLE}"
          chmod +x "${BIN_DIR}/nodespace-${TRIPLE}"

          echo "Sidecars built:"
          ls -la "${BIN_DIR}/"

      - name: Install Protobuf (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'windows-latest'
        run: choco install protoc --yes
        shell: bash

      - name: Build nodespaced and nodespace sidecars (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.platform == 'windows-latest'
        shell: bash
        run: |
          TRIPLE="${{ matrix.rust_targets }}"
          BIN_DIR="packages/desktop-app/src-tauri/binaries"
          mkdir -p "${BIN_DIR}"

          echo "Building nodespaced for ${TRIPLE}..."
          cargo build --release --bin nodespaced --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespaced.exe" "${BIN_DIR}/nodespaced-${TRIPLE}.exe"

          echo "Building nodespace CLI stub for ${TRIPLE}..."
          cargo build --release --bin nodespace --target "${TRIPLE}"
          cp "target/${TRIPLE}/release/nodespace.exe" "${BIN_DIR}/nodespace-${TRIPLE}.exe"

          echo "Sidecars built:"
          ls -la "${BIN_DIR}/"

      - name: Build Tauri app
        if: steps.filter.outputs.skip != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS minimum version — must be 14.0+ for Metal GPU embeddings (ggml)
          # 10.15 caused ggml_mul_mat assertion failures in build_pooling (#990)
          MACOSX_DEPLOYMENT_TARGET: "14.0"
          # Apple code signing and notarization (macOS only)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Michael Libio (F4M5J7YNLS)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: packages/desktop-app
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          # Only set releaseId when triggered by release event (undefined for workflow_dispatch)
          releaseId: ${{ github.event_name == 'release' && github.event.release.id || '' }}

      - name: Upload artifacts (workflow_dispatch only)
        if: steps.filter.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.rust_targets || 'default' }}
          path: |
            target/${{ matrix.rust_targets || '' }}/release/bundle/
            target/release/bundle/
          if-no-files-found: warn
          # Inspection-only (workflow_dispatch): short window for manual download.
          retention-days: 7

  build-pkg-macos:
    name: Build macOS .pkg installer (ARM)
    runs-on: macos-latest
    needs: build-tauri-macos-arm
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.platform == 'all' || inputs.platform == 'macos-pkg'))

    env:
      TRIPLE: aarch64-apple-darwin
      APPLE_SIGNING_IDENTITY: "Developer ID Application: Michael Libio (F4M5J7YNLS)"
      APPLE_INSTALLER_IDENTITY: "Developer ID Installer: Michael Libio (F4M5J7YNLS)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Import Apple Developer certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

          echo "${APPLE_CERTIFICATE}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild

          echo "${APPLE_INSTALLER_CERTIFICATE}" | base64 --decode > "$RUNNER_TEMP/installer-cert.p12"
          security import "$RUNNER_TEMP/installer-cert.p12" \
            -k "${KEYCHAIN_PATH}" \
            -P "${APPLE_INSTALLER_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/productbuild

          security list-keychains -d user -s "${KEYCHAIN_PATH}" "$(security list-keychains -d user | xargs)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Download .app bundle artifact
        uses: actions/download-artifact@v7
        with:
          name: app-bundle-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/bundle/macos/

      - name: Build nodespaced and nodespace binaries
        run: |
          # Build the headless binaries that go into /usr/local/bin/ in the .pkg.
          # The .app bundle is reused from the upstream Tauri job (downloaded above).
          cargo build --release \
            --bin nodespaced --bin nodespace \
            --target aarch64-apple-darwin

      - name: Build .pkg installer
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/build-pkg.sh

      - name: Upload .pkg to release
        if: github.event_name == 'release'
        run: |
          PKG=$(ls target/pkg-output/*.pkg | head -1)
          gh release upload ${{ github.event.release.tag_name }} "${PKG}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .pkg as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: installer-macos-pkg
          path: target/pkg-output/*.pkg
          if-no-files-found: warn
          # Inspection-only (workflow_dispatch): the distribution path for a real
          # release is the Release asset (gh release upload above), so the artifact
          # copy is redundant there — keep it short.
          retention-days: 7

  build-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            id: macos-arm
          - os: macos-latest
            target: x86_64-apple-darwin
            id: macos-intel
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            id: linux-arm
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            id: linux-x86

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            id: windows-x86

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check platform filter
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" ]] || [[ "${{ inputs.platform }}" == "all" ]] || [[ "${{ inputs.platform }}" == "${{ matrix.id }}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.id }} (selected: ${{ inputs.platform }})"
          fi

      - name: Checkout repository
        if: steps.filter.outputs.skip != 'true'
        uses: actions/checkout@v7

      - name: Install Rust stable
        if: steps.filter.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: steps.filter.outputs.skip != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Protobuf (macOS)
        if: steps.filter.outputs.skip != 'true' && matrix.os == 'macos-latest'
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew untap aws/tap azure/bicep 2>/dev/null || true
          brew install protobuf

      - name: Install Protobuf (Linux)
        if: steps.filter.outputs.skip != 'true' && matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libgtk-3-dev libxdo-dev

      - name: Install Protobuf (Windows)
        if: steps.filter.outputs.skip != 'true' && matrix.os == 'windows-latest'
        run: choco install protoc --yes
        shell: bash

      - name: Install cross-compilation toolchain (Linux ARM)
        if: steps.filter.outputs.skip != 'true' && matrix.id == 'linux-arm'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y libxml2:arm64
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libgtk-3-dev:arm64 libxdo-dev:arm64 libssl-dev:arm64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Build nodespaced
        if: steps.filter.outputs.skip != 'true'
        run: cargo build --release --bin nodespaced --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-g++' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.id == 'linux-arm' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.id == 'linux-arm' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.id == 'linux-arm' && '/' || '' }}

      - name: Build nodespace CLI
        if: steps.filter.outputs.skip != 'true' && matrix.os != 'windows-latest'
        run: cargo build --release --bin nodespace --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-gcc' || '' }}
          CXX_aarch64_unknown_linux_gnu: ${{ matrix.id == 'linux-arm' && 'aarch64-linux-gnu-g++' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.id == 'linux-arm' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.id == 'linux-arm' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.id == 'linux-arm' && '/' || '' }}

      - name: Rename binaries with target triple suffix
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then EXT=".exe"; fi
          cp "target/${{ matrix.target }}/release/nodespaced${EXT}" "nodespaced-${{ matrix.target }}${EXT}"
          if [[ "${{ matrix.os }}" != "windows-latest" ]]; then
            cp "target/${{ matrix.target }}/release/nodespace" "nodespace-${{ matrix.target }}"
          fi

      - name: Upload binaries to release
        if: steps.filter.outputs.skip != 'true' && github.event_name == 'release'
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            gh release upload ${{ github.event.release.tag_name }} \
              "nodespaced-${{ matrix.target }}.exe" \
              --clobber
          else
            gh release upload ${{ github.event.release.tag_name }} \
              "nodespaced-${{ matrix.target }}" \
              "nodespace-${{ matrix.target }}" \
              --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-homebrew-cask:
    name: Sync Homebrew tap cask
    runs-on: ubuntu-22.04
    needs: [build-tauri-macos-arm, build-tauri]
    # The Intel/x64 macOS leg (part of the build-tauri matrix) is not a hard
    # requirement -- scripts/update-homebrew-cask.ts tolerates a release that
    # only ships one macOS architecture (see nodespace-core#2154) and renders
    # an honest single-arch cask rather than failing. The ARM leg producing
    # the .dmg this cask always needs is the one build that must succeed.
    if: >-
      always() &&
      github.event_name == 'release' &&
      needs.build-tauri-macos-arm.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Update homebrew-nodespace cask
        run: bun run scripts/update-homebrew-cask.ts ${{ github.event.release.tag_name }} --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (or fine-grained token) with contents:write on
          # NodeSpaceAI/homebrew-nodespace -- secrets.GITHUB_TOKEN is scoped
          # to this repo only and cannot push cross-repo. Must be added as a
          # repo secret before this step can succeed; until then it fails
          # loudly here and notify-failure below opens an issue.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  sync-install-script:
    name: Pin nodespace-website's install.sh to this release
    runs-on: ubuntu-22.04
    needs: build-headless
    # A sibling of sync-homebrew-cask above, same reasoning: install.sh
    # deliberately pins to a specific, confirmed-built release rather than
    # floating to "latest" (this repo's own `release: types: [created]`
    # trigger fires before build-headless's binaries even start building,
    # so "latest" can point at a release with no CLI assets yet). This job
    # is what advances the pin once those binaries are confirmed uploaded
    # -- without it, the pin would have to be hand-edited in
    # nodespace-website after every release, the same kind of drift the
    # Homebrew cask sync job above exists to prevent for the cask.
    #
    # Unlike sync-homebrew-cask, which can depend on one narrow upstream
    # job (build-tauri-macos-arm) for exactly the leg it needs,
    # build-headless is a single job with an internal 5-way matrix
    # (fail-fast: false), and GitHub Actions only exposes that job's
    # AGGREGATE result -- not individual matrix legs -- to `needs`. This
    # script's own required set (REQUIRED_HEADLESS_TARGETS in
    # publish-install-script.ts) is only 3 of those 5 legs, so gating on
    # `needs.build-headless.result == 'success'` would skip this job
    # entirely -- silently, with no signal in the resulting
    # "Release build failed" issue -- whenever an UNRELATED leg (e.g.
    # windows-x86, which install.sh never even downloads) flakes. Instead,
    # run whenever build-headless actually finished (not cancelled) and
    # let publish-install-script.ts's own checkReleaseAssets() be the real
    # gate: it re-verifies the specific assets this job needs via `gh
    # release view` and fails loudly (exit 1) if any are missing, which
    # correctly fails this job and feeds notify-failure with a real,
    # specific reason instead of a silent no-op.
    if: >-
      always() &&
      github.event_name == 'release' &&
      needs.build-headless.result != 'cancelled'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Pin install.sh
        run: bun run scripts/publish-install-script.ts ${{ github.event.release.tag_name }} --push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT (or fine-grained token) with contents:write on
          # NodeSpaceAI/nodespace-website -- secrets.GITHUB_TOKEN is scoped
          # to this repo only and cannot push cross-repo. Must be added as
          # a repo secret before this step can succeed; until then it
          # fails loudly here and notify-failure below opens an issue.
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}

  notify-failure:
    name: Notify on build failure
    runs-on: ubuntu-22.04
    needs: [build-tauri-macos-arm, build-tauri, build-pkg-macos, build-headless, sync-homebrew-cask, sync-install-script]
    if: failure()

    steps:
      - name: Post GitHub issue on failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Release build failed: ${TAG}" \
            --body "Release build failed. Tag: ${TAG}. Run: ${RUN_URL}. Triggered by: ${{ github.event_name }}. Check the run above for the failing job and logs." \
            --label "foundation"

  upload-checksums:
    needs: build-headless
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binaries from release
        run: |
          # Note: 'nodespace-*' matches only Unix CLI binaries — the Windows CLI
          # (nodespace-x86_64-pc-windows-msvc.exe) is intentionally not uploaded
          # because the Windows CLI is a stub (Unix socket transport only).
          gh release download ${{ github.event.release.tag_name }} \
            --pattern 'nodespaced-*' --pattern 'nodespace-*' \
            --dir artifacts/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum nodespaced-* nodespace-* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to release
        run: |
          gh release upload ${{ github.event.release.tag_name }} artifacts/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
