name: Dependency audit

# Advisory scanning for known-vulnerable dependencies (Threat T9, supply chain —
# nodespace-docs/architecture/security-posture.md). The dependency graph is fully
# pinned (Cargo.lock + bun.lock committed), so this is the DETECTION layer:
#   - cargo audit (RustSec)  — accepted-with-tracking advisories in .cargo/audit.toml
#   - bun audit via scripts/audit-npm.ts — accepted advisories allowlisted in that file
# Any NEW or un-allowlisted advisory fails its job and surfaces as a red PR check.

on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        # Reads .cargo/audit.toml for accepted-with-tracking advisories.
        run: cargo audit

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: bun audit (allowlist-aware)
        # scripts/audit-npm.ts wraps `bun audit` and fails on any advisory not in
        # its justified allowlist (dev/build-only + tracked upstream-blocked).
        run: bun run audit
