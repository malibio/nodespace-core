name: Homebrew tap drift check

# Independent of the release flow: catches a stale Homebrew cask even if
# `sync-homebrew-cask` (release.yml) was skipped, failed silently, or a
# release was ever cut without the automation in place. This is the guard
# nodespace-core#2114 asked for -- "worth a standalone check ... that
# compares the tap's version against the latest release, so drift is
# detectable even if a sync step is bypassed."
#
# Runs on a schedule unrelated to release cadence, plus workflow_dispatch for
# an on-demand check.

on:
  schedule:
    - cron: "0 13 * * *" # once daily
  workflow_dispatch: {}

jobs:
  drift-check:
    name: bun run homebrew:drift-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Check tap version against latest release
        id: drift
        run: bun run homebrew:drift-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue on drift (loud failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Homebrew tap is out of sync with the latest release" \
            --body "The scheduled drift check found NodeSpaceAI/homebrew-nodespace's cask version does not match the latest nodespace-core release. Run: ${RUN_URL} for the exact versions. Fix with: bun run scripts/update-homebrew-cask.ts <latest-version> --push (requires HOMEBREW_TAP_TOKEN)." \
            --label "foundation"
