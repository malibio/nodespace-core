name: Homebrew tap drift check

# Independent of the release flow: catches a stale Homebrew cask even if
# `sync-homebrew-cask` (release.yml) was skipped, failed silently, or a
# release was ever cut without the automation in place. This is the guard
# nodespace-core#2114 asked for -- "worth a standalone check ... that
# compares the tap's version against the latest release, so drift is
# detectable even if a sync step is bypassed."
#
# Runs on a schedule unrelated to release cadence, plus workflow_dispatch for
# an on-demand check.

# Needs issues:write for the failure step's `gh issue create` -- the default
# GITHUB_TOKEN does not grant that without this block (see release.yml's
# equivalent notify-failure job, which declares the same for the same reason).
permissions:
  contents: read
  issues: write

on:
  schedule:
    - cron: "0 13 * * *" # once daily
  workflow_dispatch: {}

jobs:
  drift-check:
    name: bun run homebrew:drift-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Check tap version against latest release
        id: drift
        # tee'd to a file (not just relied on in the GH Actions log) so the
        # failure step below can quote the actual message -- confirmed drift
        # vs. the check itself erroring out (network/gh/auth) read as the
        # same red X otherwise, and an operator triaging the filed issue
        # couldn't tell which happened without opening the raw run log.
        # `shell: bash` is required for the pipe: with no `shell:` key Actions
        # runs `bash -e {0}` without pipefail, so tee's exit code would win and
        # real drift would report GREEN.
        shell: bash
        run: bun run homebrew:drift-check 2>&1 | tee drift-output.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue on failure (loud, with the actual message)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "The scheduled Homebrew tap drift check failed. Run: ${RUN_URL}"
            echo
            echo "Output:"
            echo '```'
            cat drift-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "If the output above starts with \"TAP DRIFT\", fix with:"
            echo "bun run scripts/update-homebrew-cask.ts <latest-version> --push (requires HOMEBREW_TAP_TOKEN)."
            echo "Any other message means the check itself failed to run (network/gh/auth) -- not necessarily drift; check the run log."
          } > issue-body.txt
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Homebrew tap drift check failed" \
            --body-file issue-body.txt \
            --label "foundation"
